<!doctype html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGS IT System — Cyber Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- The Dashboard hero is the built-in CSS/SVG "System Core" hologram
     (see systemCoreHtml()). The earlier optional Three.js WebGL upgrade
     has been removed by request; no external 3D library is loaded. -->
<style>
  :root{
    --bg:#05070D; --bg-2:#080C16;
    --surface:rgba(16,22,38,.72); --surface-2:rgba(24,32,52,.62); --border:rgba(41,241,255,.24);
    --text:#E9F4FF; --text-muted:#93A8C9; --text-faint:#5E7292;
    --navy:#12224A; --navy-ink:#0A1730; --navy-soft:rgba(41,241,255,.10);
    --teal:#29F1FF; --teal-soft:rgba(41,241,255,.14);
    --violet:#B76CFF; --violet-soft:rgba(183,108,255,.14);
    --gold:#FFC85C; --gold-soft:rgba(255,200,92,.14);
    --danger:#FF4D6D; --danger-soft:rgba(255,77,109,.14);
    --success:#3CFFB0; --success-soft:rgba(60,255,176,.14);
    --warn:#FFC85C; --warn-soft:rgba(255,200,92,.14);
    --neutral-soft:rgba(147,168,201,.12);
    --shadow:0 0 0 1px rgba(41,241,255,.05), 0 12px 36px rgba(0,0,0,.55);
    --glow-teal:0 0 18px rgba(41,241,255,.35);
    --glow-violet:0 0 18px rgba(183,108,255,.3);
    --radius:14px; --radius-sm:9px;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans Lao','Rajdhani','Inter',system-ui,sans-serif;
    font-size:14px; line-height:1.55;
    position:relative;
  }
  ::selection{background:var(--teal); color:#03131c;}
  a{color:var(--teal);}
  h1,h2,h3,h4{text-wrap:balance; margin:0; font-weight:700; font-family:'Orbitron','Noto Sans Lao',sans-serif; letter-spacing:.01em;}
  input,select,textarea,button{font-family:inherit; font-size:inherit; color:inherit;}
  table{font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  /* ---------- Starfield backdrop ---------- */
  #starfield{position:fixed; inset:0; z-index:-2; background:
    radial-gradient(ellipse 80% 60% at 15% -10%, rgba(183,108,255,.16), transparent 60%),
    radial-gradient(ellipse 70% 55% at 110% 10%, rgba(41,241,255,.14), transparent 60%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 60%);
  }
  #starfield canvas{position:fixed; inset:0; width:100%; height:100%; display:block;}
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(rgba(41,241,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(41,241,255,.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
  }

  /* ---------- Glass / hologram surfaces ---------- */
  .stat,.panel,.table-wrap,.policy-card,.audit-item,.modal,.banner{
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    position:relative; overflow:hidden;
  }
  .stat::before,.panel::before,.table-wrap::before,.policy-card::before,.audit-item::before{
    content:""; position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(41,241,255,.9), transparent);
    opacity:.7;
  }
  .stat::after,.panel::after,.table-wrap::after,.policy-card::after,.audit-item::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(180deg, transparent 0%, rgba(41,241,255,.10) 45%, transparent 55%);
    animation:scanSweep 5.5s linear infinite;
  }
  @keyframes scanSweep{
    0%{ transform:translateY(-100%); opacity:0; }
    8%{ opacity:.55; }
    45%{ opacity:.15; }
    55%{ opacity:0; }
    100%{ transform:translateY(220%); opacity:0; }
  }
  @keyframes materialize{
    0%{ opacity:0; transform:translateY(8px) scale(.985); filter:blur(3px); }
    60%{ opacity:1; filter:blur(0); }
    100%{ opacity:1; transform:none; }
  }
  .page-head,.stat,.panel,.table-wrap,.policy-card,.audit-item,.system-core{
    animation:materialize .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .stat-grid .stat:nth-child(1){animation-delay:.02s;} .stat-grid .stat:nth-child(2){animation-delay:.06s;}
  .stat-grid .stat:nth-child(3){animation-delay:.10s;} .stat-grid .stat:nth-child(4){animation-delay:.14s;}
  .stat-grid .stat:nth-child(5){animation-delay:.18s;} .stat-grid .stat:nth-child(6){animation-delay:.22s;}
  .stat-grid .stat:nth-child(7){animation-delay:.26s;} .stat-grid .stat:nth-child(8){animation-delay:.30s;}

  /* ---------- Ripple micro-interaction ---------- */
  .ripple-host{position:relative; overflow:hidden;}
  .ripple{
    position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(41,241,255,.55), rgba(41,241,255,0) 70%);
    transform:scale(0); animation:rippleGrow .55s ease-out forwards; z-index:5;
  }
  @keyframes rippleGrow{ to{ transform:scale(1); opacity:0; } }

  .app{display:flex; min-height:100%;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:272px; flex:0 0 272px; color:#fff;
    background:
      linear-gradient(180deg, rgba(18,34,74,.92), rgba(6,10,20,.96));
    border-right:1px solid var(--border);
    backdrop-filter:blur(18px);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    overflow-y:auto; transition:transform .2s ease; z-index:40;
    box-shadow:2px 0 30px rgba(0,0,0,.4);
  }
  .sidebar::-webkit-scrollbar{width:8px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(41,241,255,.25); border-radius:8px;}
  .brand{
    padding:20px 18px 14px; display:flex; gap:12px; align-items:flex-start;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #1c3660, #050a14 72%);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
    box-shadow:0 0 0 1px rgba(41,241,255,.35), var(--glow-teal);
    position:relative;
  }
  .brand-mark::before,.brand-mark::after{
    content:""; position:absolute; border-radius:50%; border:1px solid rgba(41,241,255,.55);
    animation:orbitSpin linear infinite;
  }
  .brand-mark::before{ inset:-7px; border-top-color:var(--violet); border-left-color:transparent; animation-duration:6s; }
  .brand-mark::after{ inset:-13px; border-color:rgba(183,108,255,.28); border-bottom-color:var(--teal); animation-duration:10s; animation-direction:reverse; }
  @keyframes orbitSpin{ to{ transform:rotate(360deg); } }
  .brand-text .k1{font-weight:700; font-size:14.5px; line-height:1.3; font-family:'Orbitron',sans-serif; letter-spacing:.03em; color:#EAFBFF; text-shadow:0 0 14px rgba(41,241,255,.45);}
  .brand-text .k2{font-size:11px; color:rgba(180,210,240,.68); margin-top:3px;}
  .lang-toggle{
    flex:none; display:flex; gap:2px; padding:2px; margin-left:auto;
    background:rgba(6,10,20,.55); border:1px solid var(--border); border-radius:999px;
  }
  .lang-toggle .lang-btn{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    font-family:'Rajdhani','Noto Sans Lao',sans-serif; font-weight:600; font-size:10.5px;
    letter-spacing:.04em; padding:4px 9px; border-radius:999px; transition:background .15s,color .15s;
  }
  .lang-toggle .lang-btn:hover{ color:var(--text); }
  .lang-toggle .lang-btn.active{ background:var(--teal); color:#03131c; box-shadow:var(--glow-teal); }
  .nav{padding:10px 10px 20px;}
  .nav-group-label{
    font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--teal);
    padding:16px 10px 6px; opacity:.75; font-family:'Rajdhani',sans-serif; font-weight:700;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border-radius:9px; border:1px solid transparent; background:transparent; color:rgba(225,238,250,.82);
    cursor:pointer; font-size:13.5px; position:relative; overflow:hidden;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .nav-item .ic{font-size:15px; width:20px; text-align:center; flex:none; filter:drop-shadow(0 0 4px rgba(41,241,255,.25));}
  .nav-item .lb{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .code{font-size:10px; color:rgba(255,255,255,.4); flex:none; font-family:'Rajdhani',monospace;}
  .nav-item:hover{background:rgba(41,241,255,.08); border-color:rgba(41,241,255,.18); color:#fff;}
  .nav-item.active{
    background:linear-gradient(90deg, rgba(41,241,255,.18), rgba(41,241,255,.04));
    border-color:rgba(41,241,255,.55); color:#fff; font-weight:600;
    box-shadow:inset 2px 0 0 var(--teal), 0 0 14px rgba(41,241,255,.15);
  }
  .nav-item.active .code{color:rgba(41,241,255,.85);}

  .sidebar-foot{
    margin-top:auto; padding:14px 18px 18px; border-top:1px solid var(--border);
    font-size:11px; color:rgba(180,200,225,.6); line-height:1.6;
  }

  /* ---------- Topbar (mobile) ---------- */
  .topbar{
    display:none; position:sticky; top:0; z-index:30; color:#fff;
    background:linear-gradient(180deg, rgba(18,34,74,.95), rgba(6,10,20,.95));
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    align-items:center; gap:10px; padding:12px 14px; box-shadow:var(--shadow);
  }
  .menu-btn{
    background:rgba(41,241,255,.12); border:1px solid var(--border); color:#fff; width:34px; height:34px;
    border-radius:8px; font-size:17px; cursor:pointer; flex:none;
  }
  .scrim{display:none; position:fixed; inset:0; background:rgba(2,5,10,.65); backdrop-filter:blur(2px); z-index:35;}
  .scrim.show{display:block;}

  /* ---------- Sound toggle ---------- */
  .sound-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:7px 10px; margin-bottom:10px; border-radius:8px; cursor:pointer;
    background:rgba(41,241,255,.08); border:1px solid var(--border); color:#cfeeff; font-size:11.5px;
  }
  .sound-toggle:hover{background:rgba(41,241,255,.16);}
  .sound-toggle .dot{width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 8px var(--success);}
  .sound-toggle.muted .dot{background:var(--text-faint); box-shadow:none;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .content{padding:22px 26px 60px; max-width:1180px; width:100%; margin:0 auto;}
  .content.wide{max-width:none; padding-left:18px; padding-right:18px;}
  table.data.compact{min-width:0;}
  table.data.compact th{padding:9px 7px !important; font-size:.6rem !important; letter-spacing:.04em !important; white-space:nowrap;}
  table.data.compact td{padding:7px 7px; font-size:12px !important; white-space:nowrap; line-height:1.35;}
  table.data.compact td.wrap{white-space:normal; max-width:170px; min-width:80px;}
  table.data.compact td:first-child{white-space:nowrap !important; max-width:none !important;}
  table.data.compact td.actions{padding-left:4px; padding-right:4px;}
  .wide-hint{font-size:11px; color:var(--text-dim,#8aa); padding:6px 4px 0;}
  .page-head{
    display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;
    margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border);
  }
  .page-head h1{font-size:20px; color:#F2FBFF; text-shadow:0 0 20px rgba(41,241,255,.18);}
  .page-eyebrow{
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal);
    display:flex; align-items:center; gap:8px; margin-bottom:5px; font-family:'Rajdhani',sans-serif; font-weight:700;
  }
  .code-chip{
    background:var(--navy-soft); color:var(--teal); border:1px solid var(--border); border-radius:5px; padding:1px 7px;
    font-size:10.5px; font-weight:700; letter-spacing:.03em; font-family:'Rajdhani',monospace;
  }
  .page-sub{color:var(--text-muted); font-size:13px; margin-top:5px; max-width:60ch;}
  .head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap;
    position:relative; overflow:hidden; transition:border-color .15s ease, box-shadow .15s ease, transform .08s ease;
  }
  .btn:hover{border-color:var(--teal); box-shadow:0 0 14px rgba(41,241,255,.18);}
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg, rgba(41,241,255,.22), rgba(183,108,255,.14));
    border-color:var(--teal); color:#EAFBFF; box-shadow:0 0 16px rgba(41,241,255,.16);
  }
  .btn-primary:hover{box-shadow:0 0 22px rgba(41,241,255,.35);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{color:var(--danger); border-color:rgba(255,77,109,.35);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:7px;}
  .icon-btn{
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; color:var(--text-muted);
    position:relative; overflow:hidden; transition:color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{color:var(--teal); border-color:var(--teal); box-shadow:0 0 10px rgba(41,241,255,.25);}

  .search-wrap{position:relative; flex:1; min-width:180px; max-width:320px;}
  .search-wrap input{
    width:100%; padding:8px 12px 8px 30px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text);
  }
  .search-wrap input:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(41,241,255,.12);}
  .search-wrap::before{content:"🔍"; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.6;}

  /* ---------- Banner ---------- */
  .banner{
    display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:9px;
    background:var(--warn-soft); border:1px solid var(--gold); color:var(--gold); font-size:12.5px; margin-bottom:16px;
  }
  .banner.info{background:var(--navy-soft); border-color:var(--teal); color:var(--teal);}

  /* ---------- Stat tiles ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.stat-grid{grid-template-columns:1fr;}}
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .stat:hover{transform:translateY(-2px); border-color:rgba(41,241,255,.5); box-shadow:var(--shadow), var(--glow-teal);}
  .stat .lbl{font-size:11.5px; color:var(--text-muted); display:flex; justify-content:flex-start; align-items:center; gap:6px;}
  .stat .stat-icon{font-size:14px; line-height:1; flex:none; filter:drop-shadow(0 0 6px rgba(41,241,255,.35));}
  .stat .val{font-size:26px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; font-family:'Orbitron',sans-serif; color:#EAFBFF; text-shadow:0 0 16px rgba(41,241,255,.25);}
  .stat .sub{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
  .stat.warn .val{color:var(--gold); text-shadow:0 0 16px rgba(255,200,92,.3);}
  .stat.bad .val{color:var(--danger); text-shadow:0 0 16px rgba(255,77,109,.3);}
  .stat.good .val{color:var(--success); text-shadow:0 0 16px rgba(60,255,176,.3);}

  .panels{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media (max-width:900px){.panels{grid-template-columns:1fr;}}
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .panel h3{font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:7px; font-family:'Rajdhani',sans-serif; letter-spacing:.02em; text-transform:uppercase; color:#DCF4FF;}
  .plist{display:flex; flex-direction:column; gap:2px;}
  .prow{
    display:flex; justify-content:space-between; gap:10px; padding:8px 6px; border-radius:7px; font-size:12.5px;
    border-left:2px solid transparent; transition:background .15s ease, border-color .15s ease;
  }
  .prow:hover{background:var(--surface-2); border-left-color:var(--teal);}
  .prow .t{color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prow .m{color:var(--text-faint); flex:none;}
  .empty-mini{color:var(--text-faint); font-size:12.5px; padding:10px 6px;}

  /* ---------- Table ---------- */
  .table-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow);
  }
  .table-scroll{overflow-x:auto;}
  table.data{width:100%; border-collapse:collapse; min-width:640px;}
  table.data th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--teal); background:rgba(41,241,255,.06); padding:10px 12px; white-space:nowrap;
    position:sticky; top:0; font-family:'Rajdhani',sans-serif; font-weight:700;
    border-bottom:1px solid var(--border);
  }
  table.data td{padding:10px 12px; border-top:1px solid var(--border); font-size:13px; vertical-align:top;}
  table.data tbody tr{transition:background .12s ease;}
  table.data tbody tr:hover{background:rgba(41,241,255,.06);}
  table.data td.wrap{max-width:260px; white-space:normal;}
  table.data td.actions{white-space:nowrap; text-align:right;}
  .row-actions{display:inline-flex; gap:4px;}
  .empty-state{padding:48px 20px; text-align:center; color:var(--text-muted);}
  .empty-state .big{font-size:30px; margin-bottom:8px; filter:drop-shadow(0 0 12px rgba(41,241,255,.3));}

  .badge{
    display:inline-flex; align-items:center; padding:2px 9px; border-radius:99px; font-size:11.5px;
    font-weight:600; white-space:nowrap; border:1px solid transparent;
  }
  .badge-good{background:var(--success-soft); color:var(--success); border-color:rgba(60,255,176,.3);}
  .badge-bad{background:var(--danger-soft); color:var(--danger); border-color:rgba(255,77,109,.3);}
  .badge-warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(255,200,92,.3);}
  .badge-neutral{background:var(--neutral-soft); color:var(--text-muted); border-color:var(--border);}

  /* ---------- Modal ---------- */
  .modal-scrim{
    position:fixed; inset:0; background:rgba(2,5,12,.72); backdrop-filter:blur(3px); display:flex; align-items:flex-start;
    justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:linear-gradient(180deg, rgba(20,28,48,.95), rgba(9,13,24,.97)); border-radius:14px; width:100%; max-width:560px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(41,241,255,.18), 0 0 40px rgba(41,241,255,.08);
    border:1px solid var(--border);
    animation:modalIn .22s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(-10px) scale(.97); } to{ opacity:1; transform:none; } }
  .modal-head{
    padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h3{font-size:14.5px; font-family:'Rajdhani',sans-serif; letter-spacing:.02em; color:#EAFBFF;}
  .modal-body{padding:18px 20px; display:flex; flex-direction:column; gap:13px; max-height:64vh; overflow-y:auto;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--text-muted);}
  .field label .req{color:var(--danger);}
  .field input,.field select,.field textarea{
    padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:rgba(5,8,16,.6); width:100%; color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(41,241,255,.12);}
  .field textarea{min-height:64px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}

  .confirm-modal .modal{max-width:380px;}
  .confirm-modal .modal-body{color:var(--text-muted); font-size:13px;}

  /* ---------- Toast ---------- */
  #toastRoot{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:linear-gradient(135deg, rgba(41,241,255,.22), rgba(18,34,74,.92)); color:#EAFBFF; padding:10px 16px; border-radius:9px; font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(41,241,255,.3), 0 0 18px rgba(41,241,255,.18); max-width:320px;
    animation:toastIn .25s ease both;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:none; } }
  .toast.err{background:linear-gradient(135deg, rgba(255,77,109,.35), rgba(30,10,18,.92)); box-shadow:0 8px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,77,109,.35), 0 0 18px rgba(255,77,109,.2);}

  /* ---------- Policy page ---------- */
  .policy-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .policy-card h2{font-size:15.5px; color:var(--teal); margin-bottom:4px; text-shadow:0 0 12px rgba(41,241,255,.2);}
  .policy-card .ref{font-size:11.5px; color:var(--text-faint); margin-bottom:12px; font-family:'Rajdhani',monospace;}
  .policy-card ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:13px;}
  .policy-card h4{font-size:12.5px; color:var(--violet); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.03em;}

  /* ---------- Audit checklist ---------- */
  .audit-item{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .audit-item .row1{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .audit-item .idx{
    width:24px; height:24px; border-radius:99px; background:var(--navy-soft); color:var(--teal); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex:none;
  }
  .audit-item .txt{flex:1; min-width:200px; font-size:13.5px; display:flex; gap:8px;}
  .audit-grid{display:grid; grid-template-columns:140px 1fr 1fr auto; gap:10px; margin-top:10px; align-items:center;}
  @media (max-width:720px){.audit-grid{grid-template-columns:1fr;}}
  .audit-grid input, .audit-grid select{
    padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:rgba(5,8,16,.6); font-size:12.5px; width:100%; color:var(--text);
  }

  .loading-row{padding:30px; text-align:center; color:var(--text-faint); font-size:12.5px;}

  /* ---------- System Core hero (Dashboard) ---------- */
  .system-core{
    position:relative; display:flex; align-items:center; justify-content:center;
    height:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
  }
  .core-ring{
    position:absolute; border-radius:50%; border:1px dashed rgba(41,241,255,.25);
    animation:orbitSpin linear infinite; aspect-ratio:1;
  }
  /* Sized off the hero box's own height (clamp keeps a sane floor/ceiling) so the
     CSS fallback rings scale up along with .core-stage-wrap instead of staying
     pinned at their old fixed px size and looking lost inside the now much
     taller hero. .system-core has overflow:hidden, so on very short/tall
     mismatched boxes the outer ring simply gets cropped at the edge rather
     than overflowing — same as the original fixed-size design already did. */
  .core-ring.r1{height:clamp(150px, 24vh, 300px); animation-duration:14s;}
  .core-ring.r2{height:clamp(210px, 34vh, 420px); border-color:rgba(183,108,255,.22); animation-duration:22s; animation-direction:reverse;}
  .core-ring.r3{height:clamp(270px, 44vh, 540px); border-color:rgba(255,200,92,.16); animation-duration:32s;}
  .core-center{
    position:relative; z-index:2; width:clamp(104px, 16vh, 190px); height:clamp(104px, 16vh, 190px); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 40% 30%, rgba(41,241,255,.22), rgba(6,10,20,.9) 70%);
    box-shadow:0 0 0 1px rgba(41,241,255,.4), 0 0 30px rgba(41,241,255,.25), inset 0 0 20px rgba(41,241,255,.12);
  }
  .core-center .core-value{font-family:'Orbitron',sans-serif; font-size:clamp(22px, 2.6vh, 34px); font-weight:800; color:#EAFBFF; text-shadow:0 0 14px rgba(41,241,255,.5);}
  .core-center .core-label{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); margin-top:2px;}
  .core-node{
    position:absolute; left:50%; top:50%; z-index:3;
    width:38px; height:38px; margin:-19px 0 0 -19px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:rgba(9,13,24,.92); border:1px solid var(--border); cursor:pointer; font-size:16px;
    box-shadow:0 0 14px rgba(41,241,255,.15);
    transition:box-shadow .15s ease, border-color .15s ease, transform .15s ease;
  }
  .core-node:hover{border-color:var(--teal); box-shadow:0 0 22px rgba(41,241,255,.5); transform:scale(1.12);}
  .core-node.attn{border-color:var(--danger); box-shadow:0 0 18px rgba(255,77,109,.55); animation:attnPulse 1.6s ease-in-out infinite;}
  @keyframes attnPulse{ 0%,100%{ box-shadow:0 0 12px rgba(255,77,109,.4);} 50%{ box-shadow:0 0 24px rgba(255,77,109,.75);} }
  .core-node .core-tip{
    position:absolute; bottom:120%; left:50%; transform:translateX(-50%); white-space:nowrap;
    background:rgba(6,10,20,.95); border:1px solid var(--border); border-radius:6px; padding:4px 8px;
    font-size:11px; color:var(--text); opacity:0; pointer-events:none; transition:opacity .12s ease;
  }
  .core-node:hover .core-tip{opacity:1;}

  /* ---------- System Core hero stage (Dashboard) ----------
     Fixed-height wrapper so the hero box keeps a stable size across
     screen widths; .system-core itself is height:100% of this. */
  .core-stage-wrap{ position:relative; height:min(76vh, 760px); min-height:460px; margin-bottom:26px; }
  @media (max-width:900px){ .core-stage-wrap{ height:min(60vh, 560px); min-height:360px; } }
  @media (max-width:640px){ .core-stage-wrap{ height:min(50vh, 420px); min-height:280px; } }

  @media (max-width:860px){
    .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .topbar{display:flex;}
    .content{padding:18px 14px 50px;}
  }
html,body{margin:0; padding:0;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }


  /* ================================================================
     GLOBAL HUD THEME — same look as the KGS Spec Score module
     (sharp cut corners, corner brackets, parallelogram chips,
      cyan/magenta accents, mono eyebrow, glitch title, scanlines)
     Overrides the earlier rounded "glass" styles above.
     ================================================================ */
  :root{
    --bg:#060810; --bg-2:#0A0F1E;
    --surface:rgba(12,18,36,.86); --surface-2:#111A33;
    --border:#1C2748; --line:#1C2748;
    --teal:#00EEFF; --teal-soft:rgba(0,238,255,.10);
    --violet:#FF2BD6; --violet-soft:rgba(255,43,214,.12);
    --navy-soft:rgba(0,238,255,.09);
    --success:#3DFFA2; --warn:#FFC23D; --gold:#FFC23D; --danger:#FF3D6E;
    --text:#E4F0FF; --text-muted:#8FA0C8; --text-faint:#62749B;
    --hud-cut:10px;
    --f-disp:'Orbitron','Noto Sans Lao',system-ui,sans-serif;
    --f-body:'Rajdhani','Noto Sans Lao',system-ui,sans-serif;
    --f-mono:'Share Tech Mono','Rajdhani',ui-monospace,Menlo,monospace;
    --glow-teal:0 0 12px rgba(0,238,255,.45);
    --radius:0px; --radius-sm:0px;
  }
  body{font-family:'Rajdhani','Noto Sans Lao','Inter',system-ui,sans-serif; font-size:15px; font-weight:500;}
  ::selection{background:#00EEFF; color:#03131A;}
  /* fixed scanlines over everything (very subtle) */
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:300;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px);}
  .ss-root::after{display:none;}

  /* ---------- page header: mono eyebrow + gradient glitch title ---------- */
  .page-head{position:relative; align-items:flex-end; padding:6px 0 16px; margin-bottom:22px; border-bottom:1px solid var(--line);}
  .page-head::after{content:""; position:absolute; left:0; bottom:-1px; width:min(280px,40%); height:2px;
    background:linear-gradient(90deg,#00EEFF,#FF2BD6); box-shadow:0 0 12px rgba(0,238,255,.45);}
  .page-eyebrow{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:#FF2BD6; gap:10px; margin-bottom:6px; font-weight:400; flex-wrap:wrap;}
  .page-eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:#3DFFA2; box-shadow:0 0 8px #3DFFA2; flex:none;}
  .code-chip{border:1px solid #FFC23D; color:#FFC23D; background:transparent; border-radius:0; padding:0 7px; letter-spacing:.14em; font-family:var(--f-mono); font-weight:400; font-size:.72rem;}
  .page-head h1{position:relative; display:inline-block; font-size:clamp(1.4rem,3.2vw,2.2rem); font-weight:800; letter-spacing:.06em; text-transform:uppercase; line-height:1.2;
    background:linear-gradient(90deg,#00EEFF,#8AF7FF 45%,#FF2BD6); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;
    filter:drop-shadow(0 0 10px rgba(0,238,255,.35));}
  .page-head h1::before,.page-head h1::after{content:attr(data-text); position:absolute; inset:0; -webkit-text-fill-color:currentColor; background:none; opacity:0; pointer-events:none;}
  .page-head h1::before{color:#FF2BD6; transform:translate(-3px,0);}
  .page-head h1::after{color:#00EEFF; transform:translate(3px,0);}
  .page-sub{color:var(--text-muted); font-size:1rem; max-width:70ch; margin-top:6px;}
  .page-sub::after{content:"▌"; color:#00EEFF; margin-left:3px;}

  /* ---------- surfaces: sharp panels with corner brackets ---------- */
  .stat,.panel,.table-wrap,.policy-card,.audit-item,.system-core{
    border-radius:0; border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(17,26,51,.92),rgba(10,15,30,.92));
    box-shadow:inset 0 1px 0 rgba(0,238,255,.08),0 10px 40px rgba(0,0,0,.45);
    backdrop-filter:none; -webkit-backdrop-filter:none; overflow:visible;
  }
  .panel::before,.table-wrap::before,.policy-card::before,.audit-item::before,.system-core::before{
    content:""; position:absolute; inset:-1px; width:auto; height:auto; opacity:1; pointer-events:none;
    background:linear-gradient(#00EEFF,#00EEFF) left top/18px 2px no-repeat, linear-gradient(#00EEFF,#00EEFF) left top/2px 18px no-repeat,
      linear-gradient(#FF2BD6,#FF2BD6) right bottom/18px 2px no-repeat, linear-gradient(#FF2BD6,#FF2BD6) right bottom/2px 18px no-repeat;
    filter:drop-shadow(0 0 4px rgba(0,238,255,.6));
  }
  .panel::after,.table-wrap::after,.policy-card::after,.audit-item::after,.stat::after{display:none;}
  .table-wrap{overflow:visible;}
  .table-scroll{overflow-x:auto;}
  .system-core{overflow:hidden;}
  .system-core::before{z-index:4;}
  /* stat tiles: cut top-right corner + cyan accent bar */
  .stat{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%); background:var(--bg-2); box-shadow:none; overflow:hidden; padding:14px 16px 14px 18px;}
  .stat::before{content:""; position:absolute; left:0; top:0; bottom:0; right:auto; width:3px; height:auto; background:#00EEFF; box-shadow:0 0 10px #00EEFF; opacity:.9;}
  .stat.warn::before{background:#FFC23D; box-shadow:0 0 10px #FFC23D;}
  .stat.bad::before{background:#FF3D6E; box-shadow:0 0 10px #FF3D6E;}
  .stat.good::before{background:#3DFFA2; box-shadow:0 0 10px #3DFFA2;}
  .stat:hover{transform:none; border-color:rgba(0,238,255,.5); box-shadow:0 0 22px -6px rgba(0,238,255,.55);}
  .stat .lbl{font-family:var(--f-body); font-weight:600; font-size:.88rem; letter-spacing:.03em;}
  .stat .val{font-family:var(--f-disp); font-size:1.65rem; font-weight:800; color:#E4F0FF; text-shadow:0 0 10px rgba(228,240,255,.25);}
  .panel h3{font-family:var(--f-disp); font-size:.86rem; letter-spacing:.08em; font-weight:700; color:#E4F0FF; text-transform:uppercase; margin-bottom:12px;}
  .policy-card h2{font-family:var(--f-disp); font-size:1rem; letter-spacing:.06em; text-transform:uppercase; color:#00EEFF;}
  .policy-card h4{font-family:var(--f-mono); font-weight:400; letter-spacing:.18em; color:#FF2BD6;}
  .policy-card .ref{font-family:var(--f-mono);}
  .prow{border-radius:0; border-left:2px solid transparent;}
  .prow:hover{background:rgba(0,238,255,.07); border-left-color:#00EEFF;}
  .banner{border-radius:0; border-width:1px 1px 1px 3px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);}
  .core-ring{border-color:rgba(0,238,255,.28);}
  .core-ring.r2{border-color:rgba(255,43,214,.26);}
  .core-center .core-value{font-family:var(--f-disp);}
  .core-node{border-radius:0; transform-origin:center; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  .core-node .core-tip{clip-path:none; border-radius:0;}
  .core-node:hover{clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  .audit-item .idx{border-radius:0; font-family:var(--f-disp); clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); width:30px;}

  /* ---------- buttons: cut-corner HUD buttons ---------- */
  .btn,.icon-btn,.menu-btn,.sound-toggle{
    border-radius:0; --cut:10px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  }
  .btn{background:#111A33; border:1px solid var(--line); font-weight:600; letter-spacing:.03em; padding:8px 16px; font-size:.92rem; font-family:var(--f-body);}
  .btn:hover{border-color:#00EEFF; color:#00EEFF; background:rgba(0,238,255,.09); box-shadow:none;}
  .btn-primary{background:#00EEFF; color:#03131A; border-color:#00EEFF; font-weight:700; box-shadow:none; filter:drop-shadow(0 0 8px rgba(0,238,255,.45));}
  .btn-primary:hover{background:#7DF7FF; color:#03131A; box-shadow:none;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-danger{color:#FF3D6E; border-color:rgba(255,61,110,.45);}
  .btn-danger:hover{background:rgba(255,61,110,.12); color:#FF3D6E; border-color:#FF3D6E;}
  .btn-sm{padding:5px 11px; font-size:.84rem; --cut:7px;}
  .icon-btn{--cut:7px; background:#111A33;}
  .icon-btn:hover{box-shadow:none; background:rgba(0,238,255,.09);}
  .sound-toggle{--cut:7px; font-family:var(--f-body); font-size:.85rem;}
  .menu-btn{--cut:7px;}

  /* ---------- badges / chips ---------- */
  .badge{border-radius:0; padding:2px 12px; font-size:.78rem; font-weight:700; letter-spacing:.04em; border-width:1px;
    clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
  .badge-good{background:rgba(61,255,162,.12);} .badge-bad{background:rgba(255,61,110,.14);} .badge-warn{background:rgba(255,194,61,.12);}

  /* ---------- tables ---------- */
  table.data th{font-family:var(--f-disp); font-size:.68rem; letter-spacing:.1em; color:#00EEFF; background:rgba(0,238,255,.05); border-bottom:1px solid #00EEFF; padding:11px 12px;}
  table.data td{border-top:1px solid var(--line); font-size:.95rem;}
  table.data tbody tr{box-shadow:inset 0 0 0 0 #00EEFF;}
  table.data tbody tr:hover{background:rgba(0,238,255,.06); box-shadow:inset 3px 0 0 0 #00EEFF;}
  .empty-state .big{filter:drop-shadow(0 0 12px rgba(0,238,255,.4));}

  /* ---------- forms ---------- */
  .field label{font-size:.84rem; letter-spacing:.03em; color:var(--text-muted);}
  .field input,.field select,.field textarea,.audit-grid input,.audit-grid select,.search-wrap input{
    border-radius:0; background:#060810; border:1px solid var(--line); border-bottom:2px solid rgba(0,238,255,.35); color:var(--text); font-size:.98rem;
    transition:border-color .2s,box-shadow .2s;}
  .field input:focus,.field select:focus,.field textarea:focus,.audit-grid input:focus,.audit-grid select:focus,.search-wrap input:focus{
    outline:none; border-color:#00EEFF; box-shadow:0 0 12px rgba(0,238,255,.45);}
  .field select option,.audit-grid select option{background:#0C1224;}
  .search-wrap input{padding-left:32px;}

  /* ---------- modal ---------- */
  .modal{border-radius:0; border:1px solid var(--line); background:linear-gradient(180deg,rgba(17,26,51,.98),rgba(8,12,24,.99)); overflow:visible;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(0,238,255,.08);}
  .modal::before{content:""; position:absolute; inset:-1px; pointer-events:none;
    background:linear-gradient(#00EEFF,#00EEFF) left top/18px 2px no-repeat, linear-gradient(#00EEFF,#00EEFF) left top/2px 18px no-repeat,
      linear-gradient(#FF2BD6,#FF2BD6) right bottom/18px 2px no-repeat, linear-gradient(#FF2BD6,#FF2BD6) right bottom/2px 18px no-repeat;
    filter:drop-shadow(0 0 4px rgba(0,238,255,.6));}
  .modal-head h3{font-family:var(--f-disp); font-size:.9rem; letter-spacing:.08em; text-transform:uppercase; color:#E4F0FF; display:flex; align-items:center; gap:10px;}
  .modal-head h3::before{content:""; width:8px; height:8px; background:#00EEFF; box-shadow:0 0 12px rgba(0,238,255,.45); transform:rotate(45deg); flex:none;}
  .toast{border-radius:0; font-family:var(--f-body); font-weight:600; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);
    background:linear-gradient(90deg,rgba(0,238,255,.2),#0A0F1E); border-left:3px solid #00EEFF; box-shadow:none;}
  .toast.err{background:linear-gradient(90deg,rgba(255,61,110,.28),#0A0F1E); border-left-color:#FF3D6E;}

  /* ---------- sidebar ---------- */
  .sidebar{background:linear-gradient(180deg,#0B1330,#060810); border-right:1px solid var(--line);}
  .brand-text .k1{font-family:var(--f-disp); letter-spacing:.08em;}
  .brand{border-bottom:1px solid var(--line);}
  .lang-toggle{border-radius:0; border:1px solid var(--line); background:#0A0F1E; padding:0; gap:0;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
  .lang-toggle .lang-btn{border-radius:0; padding:7px 13px; font-family:var(--f-body); font-size:.82rem; font-weight:600;}
  .lang-toggle .lang-btn.active{background:linear-gradient(90deg,rgba(0,238,255,.22),rgba(255,43,214,.18)); color:#00EEFF; box-shadow:none; text-shadow:0 0 8px rgba(0,238,255,.6);}
  .nav-group-label{font-family:var(--f-mono); font-weight:400; font-size:.7rem; letter-spacing:.08em; color:#00EEFF; opacity:.85;}
  .nav-item{border-radius:0; font-family:var(--f-body); font-weight:600; font-size:.95rem; letter-spacing:0; border:1px solid transparent;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);}
  .nav-item:hover{background:rgba(0,238,255,.07); border-color:rgba(0,238,255,.3);}
  .nav-item.active{background:linear-gradient(90deg,rgba(0,238,255,.14),rgba(255,43,214,.06)); border-color:#00EEFF; box-shadow:inset 3px 0 0 #00EEFF; font-weight:700;}
  .nav-item .code{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.06em;}
  .sidebar-foot{border-top:1px solid var(--line);}
  .topbar{background:linear-gradient(180deg,#0B1330,#060810); border-bottom:1px solid var(--line);}
  .brand-mark{box-shadow:0 0 0 1px rgba(0,238,255,.4),var(--glow-teal);}

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion:no-preference){
    .page-head h1::before{animation:hudGlitchA 7s infinite steps(1);}
    .page-head h1::after{animation:hudGlitchB 7s infinite steps(1);}
    @keyframes hudGlitchA{0%,92%,100%{opacity:0}93%{opacity:.8;clip-path:inset(10% 0 60% 0)}95%{opacity:.8;clip-path:inset(55% 0 10% 0);transform:translate(-5px,0)}97%{opacity:.7;clip-path:inset(30% 0 40% 0)}}
    @keyframes hudGlitchB{0%,92%,100%{opacity:0}94%{opacity:.8;clip-path:inset(60% 0 15% 0)}96%{opacity:.8;clip-path:inset(5% 0 70% 0);transform:translate(5px,0)}98%{opacity:.6;clip-path:inset(40% 0 35% 0)}}
    .page-eyebrow::before{animation:hudBlink 2.4s steps(2,end) infinite;}
    .page-sub::after{animation:hudBlink 1s steps(2,end) infinite;}
    @keyframes hudBlink{50%{opacity:.25;}}
    .stat-grid .stat,.panel,.table-wrap,.policy-card,.audit-item{animation:hudRise .5s cubic-bezier(.2,.8,.2,1) both;}
    @keyframes hudRise{from{opacity:0; transform:translateY(10px);}}
  }

  /* ---------- PC Spec Score module (cyber HUD look, same as the standalone KGS Spec Score) ---------- */
  .ss-root{
    --bg:#060810; --bg2:#0A0F1E; --surface:#0C1224; --sunk:#111A33; --ink:#E4F0FF; --muted:#7D8DB5; --line:#1C2748;
    --accent:#00EEFF; --accent2:#FF2BD6; --accent-ink:#03131A; --accent-soft:rgba(0,238,255,.09);
    --good:#3DFFA2; --warn:#FFC23D; --bad:#FF3D6E;
    --glow:0 0 12px rgba(0,238,255,.45); --glow2:0 0 14px rgba(255,43,214,.45);
    --f-body:"Rajdhani","Noto Sans Lao",system-ui,sans-serif; --f-disp:"Orbitron","Noto Sans Lao",system-ui,sans-serif; --f-mono:"Share Tech Mono","Rajdhani",ui-monospace,Menlo,monospace;
    --cut:10px;
    position:relative; z-index:1; display:flex; flex-direction:column; gap:20px;
    font-family:var(--f-body); font-size:15px; font-weight:500; line-height:1.55; color:var(--ink);
  }
  .ss-root *{box-sizing:border-box;}
  .ss-root::after{content:""; position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px); z-index:50;}
  #ssFx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:-1;}
  .ss-root h1,.ss-root h2,.ss-root h3,.ss-root h4{font-family:var(--f-disp); text-wrap:balance; margin:0; line-height:1.25;}
  .ss-root .ss-num{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
  .ss-root button,.ss-root select,.ss-root input{font:inherit; color:inherit;}
  .ss-root button{cursor:pointer;}
  .ss-root :focus-visible{outline:2px solid var(--accent); outline-offset:2px; box-shadow:var(--glow);}

  .ss-top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; padding-block:6px 14px; border-bottom:1px solid var(--line); position:relative;}
  .ss-top::after{content:""; position:absolute; left:0; bottom:-1px; width:min(280px,40%); height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:var(--glow);}
  .ss-brand{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .ss-brand small{color:var(--muted); font-size:.95rem;}
  .ss-sys{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.2em; color:var(--accent2); text-transform:uppercase; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .ss-sys i{width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good);}
  .ss-draft{border:1px solid var(--warn); color:var(--warn); padding:0 7px; letter-spacing:.14em;}
  .ss-h1{position:relative; font-size:clamp(1.5rem,3.4vw,2.3rem)!important; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    background:linear-gradient(90deg,var(--accent),#8AF7FF 45%,var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px rgba(0,238,255,.35));}
  .ss-h1::before,.ss-h1::after{content:attr(data-text); position:absolute; inset:0; -webkit-text-fill-color:currentColor; background:none; opacity:0; pointer-events:none;}
  .ss-h1::before{color:var(--accent2); transform:translate(-3px,0);}
  .ss-h1::after{color:var(--accent); transform:translate(3px,0);}
  .ss-cursor::after{content:"▌"; color:var(--accent); margin-left:2px;}
  .ss-tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .ss-btn{border:1px solid var(--line); background:var(--sunk); padding:7px 16px; font-size:.9rem; font-weight:600; letter-spacing:.03em; color:var(--ink);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); transition:background .2s,border-color .2s,box-shadow .2s,color .2s;}
  .ss-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .ss-btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; box-shadow:var(--glow);}
  .ss-btn.primary:hover{background:#7DF7FF; color:var(--accent-ink);}
  .ss-btn.danger{color:var(--bad); border-color:rgba(255,61,110,.45);}
  .ss-btn.danger:hover{background:rgba(255,61,110,.12); color:var(--bad); border-color:var(--bad);}
  .ss-btn.fs{color:var(--accent); border-color:rgba(0,238,255,.45);}
  .ss-kbd{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); border:1px solid var(--line); padding:0 5px; margin-left:6px;}
  .ss-seg{display:inline-flex; border:1px solid var(--line); background:var(--bg2); clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
  .ss-seg button{border:0; background:transparent; padding:7px 13px; font-size:.88rem; font-weight:600; color:var(--muted);}
  .ss-seg button:hover{color:var(--ink);}
  .ss-seg button[aria-pressed="true"]{background:linear-gradient(90deg,rgba(0,238,255,.22),rgba(255,43,214,.18)); color:var(--accent); text-shadow:0 0 8px rgba(0,238,255,.6);}

  /* profile bar stays pinned while scrolling the page */
  .ss-profiles{display:flex; flex-direction:column; gap:10px; position:sticky; top:0; z-index:20; padding:10px 14px 12px; margin:0 -14px;
    background:linear-gradient(180deg,rgba(6,8,16,.97),rgba(6,8,16,.93)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); box-shadow:0 10px 24px -12px rgba(0,0,0,.7); max-height:62vh; overflow-y:auto;}
  .ss-profiles::after{content:""; position:absolute; left:14px; bottom:-1px; width:min(160px,30%); height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:var(--glow); pointer-events:none;}
  @media (max-width:860px){
    .ss-profiles{top:59px; max-height:46vh;}
    .ss-profiles .ss-chips{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;}
    .ss-profiles .ss-chip{flex:none; white-space:nowrap;}
  }
  .ss-root h3.ss-h3{font-size:.72rem; text-transform:uppercase; letter-spacing:.18em; color:var(--accent); font-weight:600;}
  .ss-chips{display:flex; flex-wrap:wrap; gap:10px;}
  .ss-chip{border:1px solid var(--line); background:var(--sunk); padding:7px 18px; font-size:.92rem; font-weight:600; color:var(--muted); clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); transition:all .2s;}
  .ss-chip:hover:not(:disabled){color:var(--ink); border-color:var(--accent);}
  .ss-chip[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),#5CF4FF); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
  .ss-chip:disabled{opacity:.55; cursor:default;}
  .ss-chip:disabled[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent2),#FF7BE6); border-color:var(--accent2); opacity:1; color:#1a0314;}
  .ss-weights summary{cursor:pointer; color:var(--accent); font-size:.88rem; letter-spacing:.04em; width:max-content;}
  .ss-wgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px 18px; margin-top:12px; padding:14px; border:1px dashed var(--line); background:var(--bg2);}
  .ss-wgrid label{display:flex; flex-direction:column; font-size:.84rem; color:var(--muted);}
  .ss-wgrid label .ss-num{color:var(--accent);}
  .ss-wgrid input[type=range]{accent-color:var(--accent2);}

  .ss-panel{position:relative; background:linear-gradient(180deg,rgba(17,26,51,.92),rgba(10,15,30,.92)); border:1px solid var(--line); padding:18px; display:flex; flex-direction:column; gap:16px; min-width:0; box-shadow:inset 0 1px 0 rgba(0,238,255,.08),0 10px 40px rgba(0,0,0,.45);}
  .ss-panel::before{content:""; position:absolute; inset:-1px; pointer-events:none;
    background:linear-gradient(var(--accent),var(--accent)) left top/18px 2px no-repeat, linear-gradient(var(--accent),var(--accent)) left top/2px 18px no-repeat,
     linear-gradient(var(--accent2),var(--accent2)) right bottom/18px 2px no-repeat, linear-gradient(var(--accent2),var(--accent2)) right bottom/2px 18px no-repeat;
    filter:drop-shadow(0 0 4px rgba(0,238,255,.6));}
  .ss-panel-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .ss-root h2.ss-h2{font-size:1rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:10px;}
  .ss-root h2.ss-h2::before{content:""; width:8px; height:8px; background:var(--accent); box-shadow:var(--glow); transform:rotate(45deg); flex:none;}
  .ss-hint{font-size:.78rem; color:var(--muted);}
  .ss-confirm{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.9rem; color:var(--bad);}
  .ss-confirm.mute{color:var(--muted);}

  .ss-rank{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr)); gap:12px;}
  .ss-rank li.ss-hint{grid-column:1/-1; padding:10px 4px; font-size:.9rem;}
  .ss-rank li button{width:100%; height:100%; display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:12px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--bg2); padding:12px;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%); will-change:transform; transition:border-color .2s,background .2s,box-shadow .2s,transform .15s ease-out;}
  .ss-rank li button:hover{border-color:rgba(0,238,255,.5); box-shadow:0 0 22px -6px rgba(0,238,255,.55);}
  .ss-rank li button[aria-current="true"]{border-color:var(--accent); background:linear-gradient(90deg,rgba(0,238,255,.13),rgba(255,43,214,.06)); box-shadow:inset 3px 0 0 var(--accent);}
  .ss-pos{font-family:var(--f-disp); font-size:1.15rem; font-weight:700; color:var(--muted); text-align:center;}
  .ss-rank li:first-child .ss-pos{color:var(--accent); text-shadow:var(--glow);}
  .ss-nm{font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
  .ss-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:.8rem; color:var(--muted); margin-top:3px;}
  .ss-bar{display:block; height:5px; background:rgba(124,141,181,.16); overflow:hidden; margin-top:8px;}
  .ss-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 8px rgba(0,238,255,.6); position:relative; transition:width .45s cubic-bezier(.2,.8,.2,1);}
  .ss-bar i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent); transform:translateX(-100%);}
  .ss-sc{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .ss-sc b{font-family:var(--f-disp); font-size:1.65rem; font-weight:800; line-height:1; text-shadow:0 0 10px rgba(228,240,255,.25);}
  .ss-grade{font-family:var(--f-disp); font-weight:800; font-size:.75rem; padding:2px 8px; border:1px solid currentColor; text-shadow:0 0 6px currentColor; box-shadow:0 0 8px -2px currentColor inset;}
  .ss-good{color:var(--good);} .ss-warn{color:var(--warn);} .ss-bad{color:var(--bad);}
  .ss-tag{font-size:.72rem; border:1px solid var(--line); padding:0 6px; color:var(--muted); background:rgba(124,141,181,.06);}
  .ss-tag-ok{color:var(--good); border-color:rgba(61,255,162,.4); background:rgba(61,255,162,.08);}
  .ss-pill{font-size:.75rem; font-weight:700; padding:2px 10px; color:var(--accent-ink); clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
  .ss-pill.keep{background:var(--good); box-shadow:0 0 10px var(--good);} .ss-pill.up{background:var(--warn);} .ss-pill.rep{background:var(--bad);}

  .ss-sheet{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(280px,360px); gap:28px; align-items:center; padding:22px; background:radial-gradient(260px 160px at 110px 50%,rgba(0,238,255,.10),transparent 70%); border:1px solid var(--line); position:relative; overflow:hidden;}
  .ss-sheet::after{content:""; position:absolute; left:0; right:0; top:-80px; height:80px; pointer-events:none; background:linear-gradient(transparent,rgba(0,238,255,.09),transparent);}
  @media (max-width:1150px){.ss-sheet{grid-template-columns:auto minmax(0,1fr);} .ss-radar-box{grid-column:1/-1; justify-self:center;}}
  @media (max-width:600px){.ss-sheet{grid-template-columns:1fr; justify-items:center;}}
  .ss-ring{width:230px; height:230px; overflow:visible;}
  .ss-ring .ss-arc{filter:drop-shadow(0 0 6px currentColor);}
  .ss-ring .tk{opacity:.25;} .ss-ring .tk.on{opacity:1; filter:drop-shadow(0 0 3px #00EEFF);}
  .ss-ring text{fill:var(--ink);}
  .ss-verdict{display:flex; flex-direction:column; gap:9px; min-width:0; width:100%;}
  .ss-gradebig{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .ss-holo{font-family:var(--f-disp); font-size:3.4rem; font-weight:800; line-height:.95;
    background:linear-gradient(115deg,var(--accent) 0%,#FFFFFF 22%,var(--accent2) 45%,var(--accent) 70%,#B6FFF0 100%); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 12px rgba(0,238,255,.35));}
  .ss-tier{font-family:var(--f-disp); font-size:1rem; letter-spacing:.14em; text-transform:uppercase;}
  .ss-metas{display:flex; gap:6px 16px; flex-wrap:wrap; font-size:.9rem; color:var(--muted);}
  .ss-metas .ss-num{color:var(--ink);}
  .ss-flags{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; font-size:.92rem;}
  .ss-flags li{display:flex; gap:9px; align-items:baseline;}
  .ss-flags li::before{content:""; flex:none; width:8px; height:8px; background:var(--warn); box-shadow:0 0 6px var(--warn); transform:rotate(45deg) translateY(-1px);}
  .ss-flags li.bad::before{background:var(--bad); box-shadow:0 0 6px var(--bad);} .ss-flags li.ok::before{background:var(--good); box-shadow:0 0 6px var(--good);}
  .ss-radar-box{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; width:100%;}
  #ssRadar{width:100%; max-width:360px; height:auto; overflow:visible;}
  #ssRadar .ss-lbl{font-family:var(--f-body); font-size:11px; font-weight:600; fill:#9FB0D8;}
  #ssRadar .shape{filter:drop-shadow(0 0 6px rgba(0,238,255,.7));}
  .ss-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:.8rem; color:var(--muted);}
  .ss-legend span::before{content:""; display:inline-block; width:14px; height:3px; margin-right:6px; vertical-align:middle; background:var(--accent); box-shadow:var(--glow);}
  .ss-legend span.g::before{background:repeating-linear-gradient(90deg,var(--accent2) 0 4px,transparent 4px 7px); box-shadow:none;}
  .ss-bk{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr)); gap:9px 40px;}
  .ss-bk h4{grid-column:1/-1; font-size:.72rem; text-transform:uppercase; letter-spacing:.18em; color:var(--accent); font-weight:600;}
  .ss-bk-row{display:grid; grid-template-columns:minmax(0,11rem) minmax(0,1fr) 2.6rem 2.8rem; gap:12px; align-items:center; font-size:.92rem;}
  .ss-bk-row .ss-bar{margin:0; height:8px;}
  .ss-bk-row .ss-w{color:var(--muted); font-size:.78rem; text-align:right;}
  .ss-bk-row.na{opacity:.4;}
  @media (max-width:540px){.ss-bk-row{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 2.2rem 2.4rem; gap:8px; font-size:.84rem;}}

  .ss-spec{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr)); gap:16px; align-items:start;}
  .ss-fs{border:1px solid var(--line); padding:12px 14px 14px; margin:0; min-width:0; background:rgba(6,8,16,.35);}
  .ss-fs legend{font-family:var(--f-disp); font-weight:700; padding:0 8px; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);}
  .ss-fg{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;}
  .ss-f{display:flex; flex-direction:column; gap:4px; font-size:.82rem; color:var(--muted); min-width:0;}
  .ss-f input:not([type=checkbox]),.ss-f select{background:var(--bg); border:1px solid var(--line); border-bottom:2px solid rgba(0,238,255,.35); padding:7px 9px; color:var(--ink); font-size:.95rem; width:100%; transition:border-color .2s,box-shadow .2s;}
  .ss-f input:not([type=checkbox]):focus,.ss-f select:focus{outline:none; border-color:var(--accent); box-shadow:var(--glow);}
  .ss-f select option{background:var(--surface);}
  .ss-f.chk{flex-direction:row; align-items:center; gap:9px; color:var(--ink); font-size:.9rem;}
  .ss-f.chk input{accent-color:var(--accent); width:17px; height:17px;}
  .ss-f.wide{grid-column:1/-1;}

  .ss-matrix{overflow-x:auto;}
  .ss-matrix table{border-collapse:collapse; width:100%; font-size:.9rem;}
  .ss-matrix th,.ss-matrix td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap;}
  .ss-matrix th:first-child,.ss-matrix td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); z-index:1;}
  .ss-matrix thead th{font-family:var(--f-disp); font-weight:700; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border-bottom:1px solid var(--accent);}
  .ss-cell{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:1rem;}
  .ss-matrix tr.total td{font-weight:700; border-top:2px solid var(--accent2); font-size:1.05rem;}
  .ss-matrix tbody tr:hover td{filter:brightness(1.25);}
  .ss-io{display:flex; flex-direction:column; gap:10px;}
  .ss-method{font-size:.95rem; display:flex; flex-direction:column; gap:12px;}
  .ss-method>div{max-width:85ch; display:flex; flex-direction:column; gap:12px;}
  .ss-method p,.ss-method ul{margin:0;} .ss-method li{margin-bottom:5px;} .ss-method b{color:var(--accent);}
  .ss-note{border-left:3px solid var(--warn); padding:8px 14px; background:rgba(255,194,61,.07); font-size:.9rem;}
  .ss-note b{color:var(--warn)!important;}

  /* full-screen focus mode for the detail panel (key F / button) */
  #ssDetail.focus{position:fixed; inset:0; z-index:200; overflow:auto; padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,3vw) 40px;
    background:radial-gradient(1200px 700px at 80% 0%,rgba(255,43,214,.12),transparent 60%),radial-gradient(900px 600px at 0% 20%,rgba(0,238,255,.12),transparent 60%),var(--bg);}
  #ssDetail.focus>*,#ssDetail:fullscreen>*{flex-shrink:0;}
  #ssDetail:fullscreen{background:var(--bg); overflow:auto; padding:24px 3vw 40px;}
  #ssDetail.focus .ss-ring{width:270px; height:270px;}

  @media (prefers-reduced-motion:no-preference){
    .ss-sys i{animation:ssBlink 2.4s steps(2,end) infinite;}
    @keyframes ssBlink{50%{opacity:.25;}}
    .ss-cursor::after{animation:ssBlink 1s steps(2,end) infinite;}
    .ss-holo{animation:ssHolo 6s linear infinite;} @keyframes ssHolo{to{background-position:300% 0;}}
    .ss-sheet::after{animation:ssSweep 5.5s linear infinite;} @keyframes ssSweep{to{top:100%;}}
    .ss-bar i::after{animation:ssShine 3.2s ease-in-out infinite;} @keyframes ssShine{60%,100%{transform:translateX(100%);}}
    .ss-h1::before{animation:ssGlitchA 7s infinite steps(1);}
    .ss-h1::after{animation:ssGlitchB 7s infinite steps(1);}
    @keyframes ssGlitchA{0%,92%,100%{opacity:0}93%{opacity:.8;clip-path:inset(10% 0 60% 0)}95%{opacity:.8;clip-path:inset(55% 0 10% 0);transform:translate(-5px,0)}97%{opacity:.7;clip-path:inset(30% 0 40% 0)}}
    @keyframes ssGlitchB{0%,92%,100%{opacity:0}94%{opacity:.8;clip-path:inset(60% 0 15% 0)}96%{opacity:.8;clip-path:inset(5% 0 70% 0);transform:translate(5px,0)}98%{opacity:.6;clip-path:inset(40% 0 35% 0)}}
    .ss-rank li{animation:ssRise .5s cubic-bezier(.2,.8,.2,1) both;} @keyframes ssRise{from{opacity:0; transform:translateY(10px)}}
  }
  /* ---- REG-003 doc-control bar + chip filters ---- */
  .doc-bar{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin:0 0 12px; padding:9px 12px; border:1px solid var(--border); background:rgba(41,241,255,.05); font-size:12.5px; color:var(--text);}
  .doc-bar .db-i b{color:var(--text-muted); font-weight:600; margin-right:4px; font-size:11.5px;}
  .doc-bar .db-n{flex-basis:100%; color:var(--text-muted); font-size:11.5px; line-height:1.5;}
  .chip-row{display:flex; flex-direction:column; gap:8px; margin:0 0 12px;}
  .chip-grp{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .chip-l{color:var(--text-muted); font-size:11.5px; min-width:84px;}
  .chip-btn{border:1px solid var(--border); background:transparent; color:var(--text); padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit; border-radius:0;}
  .chip-btn b{color:#FFC23D; margin-left:3px;}
  .chip-btn:hover{background:rgba(41,241,255,.10);}

  td.mono{font-family:'Share Tech Mono',monospace; letter-spacing:.04em;}

<script>
/* ============================================================
   Minimal in-browser XLSX reader — no external library, no
   network dependency. Uses the browser's native
   DecompressionStream('deflate-raw') to inflate ZIP entries, and
   DOMParser to read the OOXML parts we need (workbook.xml,
   workbook.xml.rels, sharedStrings.xml, sheetN.xml).
   Exposes: MiniXLSX.read(arrayBuffer) -> Promise<{sheetNames, sheets}>
     sheets[name] = array of rows, each row = array of cell values.
   ============================================================ */
var MiniXLSX = (function(){

  function readU16(dv, o){ return dv.getUint16(o, true); }
  function readU32(dv, o){ return dv.getUint32(o, true); }

  function findEOCD(bytes){
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var min = Math.max(0, bytes.length - 65557);
    for(var i = bytes.length - 22; i >= min; i--){
      if(readU32(dv, i) === 0x06054b50) return i;
    }
    throw new Error('ບໍ່ພົບໂຄງສ້າງ ZIP (End Of Central Directory) — ໄຟລ໌ອາດເພ້ຍ ຫຼື ບໍ່ແມ່ນ .xlsx');
  }

  function textDecode(bytes){
    return new TextDecoder('utf-8').decode(bytes);
  }

  async function inflateRaw(bytes){
    var ds = new DecompressionStream('deflate-raw');
    var writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    var out = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(out);
  }

  async function listEntries(bytes){
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var eocd = findEOCD(bytes);
    var entryCount = readU16(dv, eocd + 10);
    var cdOffset = readU32(dv, eocd + 16);
    var entries = {};
    var p = cdOffset;
    for(var i = 0; i < entryCount; i++){
      var sig = readU32(dv, p);
      if(sig !== 0x02014b50) break;
      var compMethod = readU16(dv, p + 10);
      var compSize = readU32(dv, p + 20);
      var uncompSize = readU32(dv, p + 24);
      var nameLen = readU16(dv, p + 28);
      var extraLen = readU16(dv, p + 30);
      var commentLen = readU16(dv, p + 32);
      var localHeaderOffset = readU32(dv, p + 42);
      var name = textDecode(bytes.subarray(p + 46, p + 46 + nameLen));
      entries[name] = {
        compMethod: compMethod, compSize: compSize, uncompSize: uncompSize,
        localHeaderOffset: localHeaderOffset
      };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function readEntry(bytes, entry){
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var lp = entry.localHeaderOffset;
    var sig = readU32(dv, lp);
    if(sig !== 0x04034b50) throw new Error('ໂຄງສ້າງໄຟລ໌ ZIP ບໍ່ຖືກຕ້ອງ');
    var nameLen = readU16(dv, lp + 26);
    var extraLen = readU16(dv, lp + 28);
    var dataStart = lp + 30 + nameLen + extraLen;
    var raw = bytes.subarray(dataStart, dataStart + entry.compSize);
    if(entry.compMethod === 0) return raw.slice();
    if(entry.compMethod === 8) return await inflateRaw(raw);
    throw new Error('ຮູບແບບການບີບອັດ ZIP ບໍ່ຮອງຮັບ (method ' + entry.compMethod + ')');
  }

  function parseXml(str){
    var doc = new DOMParser().parseFromString(str, 'application/xml');
    var err = doc.querySelector('parsererror');
    if(err) throw new Error('ອ່ານໂຄງສ້າງ XML ພາຍໃນ Excel ບໍ່ໄດ້');
    return doc;
  }

  function colLetterToIndex(ref){
    var m = /^([A-Z]+)(\d+)$/.exec(ref);
    if(!m) return null;
    var col = 0, letters = m[1];
    for(var i = 0; i < letters.length; i++){ col = col * 26 + (letters.charCodeAt(i) - 64); }
    return { col: col - 1, row: parseInt(m[2], 10) };
  }

  function excelSerialToISODate(serial){
    var n = Number(serial);
    if(!isFinite(n)) return null;
    var ms = Math.round((n - 25569) * 86400 * 1000); // 25569 = days between 1899-12-30 and 1970-01-01
    var d = new Date(ms);
    if(isNaN(d.getTime())) return null;
    var y = d.getUTCFullYear(), mo = String(d.getUTCMonth()+1).padStart(2,'0'), da = String(d.getUTCDate()).padStart(2,'0');
    return y + '-' + mo + '-' + da;
  }

  async function read(arrayBuffer){
    var bytes = new Uint8Array(arrayBuffer);
    var entries = await listEntries(bytes);

    if(!entries['xl/workbook.xml']) throw new Error('ບໍ່ແມ່ນໄຟລ໌ Excel (.xlsx) ທີ່ຖືກຕ້ອງ');

    var workbookXml = parseXml(textDecode(await readEntry(bytes, entries['xl/workbook.xml'])));
    var sheetEls = Array.prototype.slice.call(workbookXml.getElementsByTagName('sheet'));
    var sheetMeta = sheetEls.map(function(el){
      return {
        name: el.getAttribute('name'),
        rid: el.getAttribute('r:id') || el.getAttribute('rid')
      };
    });

    var relsEntry = entries['xl/_rels/workbook.xml.rels'];
    var ridToTarget = {};
    if(relsEntry){
      var relsXml = parseXml(textDecode(await readEntry(bytes, relsEntry)));
      Array.prototype.slice.call(relsXml.getElementsByTagName('Relationship')).forEach(function(el){
        ridToTarget[el.getAttribute('Id')] = el.getAttribute('Target');
      });
    }

    var sharedStrings = [];
    var ssEntry = entries['xl/sharedStrings.xml'];
    if(ssEntry){
      var ssXml = parseXml(textDecode(await readEntry(bytes, ssEntry)));
      Array.prototype.slice.call(ssXml.getElementsByTagName('si')).forEach(function(si){
        var texts = Array.prototype.slice.call(si.getElementsByTagName('t')).map(function(t){ return t.textContent; });
        sharedStrings.push(texts.join(''));
      });
    }

    var sheets = {};
    var sheetNames = [];
    for(var i = 0; i < sheetMeta.length; i++){
      var meta = sheetMeta[i];
      var target = ridToTarget[meta.rid];
      if(!target) continue;
      var path = target.indexOf('/') === 0 ? target.slice(1) : ('xl/' + target.replace(/^\.?\//,''));
      var entry = entries[path] || entries['xl/' + target];
      if(!entry) continue;
      var sheetXml = parseXml(textDecode(await readEntry(bytes, entry)));
      var rowsMap = {};
      var maxCol = 0;
      Array.prototype.slice.call(sheetXml.getElementsByTagName('row')).forEach(function(rowEl){
        var rNum = parseInt(rowEl.getAttribute('r'), 10);
        var cells = {};
        Array.prototype.slice.call(rowEl.getElementsByTagName('c')).forEach(function(c){
          var ref = c.getAttribute('r');
          var pos = ref ? colLetterToIndex(ref) : null;
          var type = c.getAttribute('t');
          var vEl = c.getElementsByTagName('v')[0];
          var val = null;
          if(type === 's'){
            var idx = vEl ? parseInt(vEl.textContent, 10) : -1;
            val = sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
          } else if(type === 'inlineStr'){
            var isEl = c.getElementsByTagName('is')[0];
            val = isEl ? isEl.textContent : '';
          } else if(type === 'str' || type === 'e'){
            val = vEl ? vEl.textContent : '';
          } else if(type === 'b'){
            val = vEl ? (vEl.textContent === '1') : null;
          } else {
            val = vEl ? Number(vEl.textContent) : null;
          }
          if(pos){
            cells[pos.col] = val;
            if(pos.col > maxCol) maxCol = pos.col;
          }
        });
        rowsMap[rNum] = cells;
      });
      var maxRow = 0;
      Object.keys(rowsMap).forEach(function(r){ if(+r > maxRow) maxRow = +r; });
      var grid = [];
      for(var r = 1; r <= maxRow; r++){
        var rowCells = rowsMap[r] || {};
        var rowArr = [];
        for(var c2 = 0; c2 <= maxCol; c2++){
          rowArr.push(rowCells[c2] !== undefined ? rowCells[c2] : null);
        }
        grid.push(rowArr);
      }
      sheets[meta.name] = grid;
      sheetNames.push(meta.name);
    }

    return { sheetNames: sheetNames, sheets: sheets };
  }

  return { read: read, excelSerialToISODate: excelSerialToISODate };
})();
</script>
<script>
(function(){
"use strict";

/* ============================================================
   SOUND ENGINE — synthesized Web Audio "hologram" tones.
   No external audio files (offline single-file app). Gated behind
   the first user gesture per browser autoplay policy; persists a
   mute preference to localStorage.
   ============================================================ */
var Sound = (function(){
  var ctx = null;
  var muted = false;
  try{ muted = window.localStorage.getItem('kgsit_sound_muted') === '1'; }catch(e){}
  function ensureCtx(){
    if(ctx) return ctx;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
    }catch(e){ ctx = null; }
    return ctx;
  }
  function tone(spec){
    if(muted) return;
    var c = ensureCtx();
    if(!c) return;
    if(c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
    var now = c.currentTime;
    var freqs = spec.freqs || [spec.freq || 440];
    var dur = spec.dur || .18;
    var type = spec.type || 'sine';
    var peak = spec.peak !== undefined ? spec.peak : .07;
    var master = c.createGain();
    master.gain.setValueAtTime(1, now);
    master.connect(c.destination);
    freqs.forEach(function(f, i){
      var start = now + (spec.stagger ? i * spec.stagger : 0);
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, start);
      if(spec.slideTo !== undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(spec.slideTo,1), start + dur);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(peak, start + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, start + dur);
      osc.connect(gain); gain.connect(master);
      try{ osc.start(start); osc.stop(start + dur + .03); }catch(e){}
    });
  }
  return {
    setMuted:function(v){ muted = !!v; try{ window.localStorage.setItem('kgsit_sound_muted', muted?'1':'0'); }catch(e){} },
    isMuted:function(){ return muted; },
    unlock:function(){ ensureCtx(); },
    click:function(){ tone({freqs:[760], type:'sine', dur:.06, peak:.05}); },
    nav:function(){ tone({freqs:[520,820], stagger:.025, type:'triangle', dur:.12, peak:.05}); },
    open:function(){ tone({freqs:[280], slideTo:920, type:'sawtooth', dur:.22, peak:.04}); },
    close:function(){ tone({freqs:[680], slideTo:200, type:'sawtooth', dur:.16, peak:.035}); },
    success:function(){ tone({freqs:[523,659,784], stagger:.07, type:'triangle', dur:.22, peak:.05}); },
    error:function(){ tone({freqs:[180,140], stagger:.1, type:'square', dur:.2, peak:.045}); },
    toast:function(){ tone({freqs:[920], type:'sine', dur:.07, peak:.03}); }
  };
})();

(function unlockAudioSetup(){
  function unlock(){ Sound.unlock(); document.removeEventListener('pointerdown', unlock); document.removeEventListener('keydown', unlock); }
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
})();

/* ---------- Ripple micro-interaction (event delegation) ---------- */
document.addEventListener('pointerdown', function(e){
  var host = e.target.closest && e.target.closest('.btn, .icon-btn, .nav-item, .core-node, .sound-toggle, table.data tbody tr');
  if(!host) return;
  host.classList.add('ripple-host');
  var rect = host.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height) * 1.6;
  var span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (e.clientX - rect.left - size/2) + 'px';
  span.style.top = (e.clientY - rect.top - size/2) + 'px';
  host.appendChild(span);
  setTimeout(function(){ span.remove(); }, 650);
}, true);

/* ---------- Count-up number animation ---------- */
function countUpValue(node, target, opts){
  opts = opts || {};
  if(typeof target !== 'number' || !isFinite(target)){ node.textContent = target; return; }
  var dur = opts.dur || 650;
  var t0 = null;
  function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(target * eased);
    if(p < 1) requestAnimationFrame(step); else node.textContent = target;
  }
  requestAnimationFrame(step);
}

/* ============================================================
   STARFIELD BACKDROP — lightweight canvas particle field.
   Respects prefers-reduced-motion (renders once, no animation loop).
   ============================================================ */
var Starfield = (function(){
  var canvas, cx, w, h, stars = [], reduced = false;
  try{ reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function makeStars(n){
    stars = [];
    for(var i=0;i<n;i++){
      stars.push({
        x: Math.random()*w, y: Math.random()*h,
        z: Math.random()*0.8+0.2, r: Math.random()*1.3+0.3,
        hue: (i%3===0) ? '0,238,255' : (i%3===1 ? '255,43,214' : '0,238,255'),
        tw: Math.random()*Math.PI*2
      });
    }
  }
  function draw(t){
    if(!cx) return;
    cx.clearRect(0,0,w,h);
    /* neon network links between nearby particles (same look as Spec Score) */
    cx.lineWidth = 1;
    for(var a=0;a<stars.length;a++){
      for(var b=a+1;b<stars.length;b++){
        var dx = stars[a].x-stars[b].x, dy = stars[a].y-stars[b].y, d2 = dx*dx+dy*dy;
        if(d2 < 12100){
          cx.strokeStyle = 'rgba(0,238,255,'+(0.13*(1-d2/12100)).toFixed(3)+')';
          cx.beginPath(); cx.moveTo(stars[a].x, stars[a].y); cx.lineTo(stars[b].x, stars[b].y); cx.stroke();
        }
      }
    }
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var alpha = 0.3 + 0.55*Math.abs(Math.sin((t||0)*0.0006 + s.tw));
      cx.beginPath();
      cx.fillStyle = 'rgba('+s.hue+','+(alpha*s.z).toFixed(2)+')';
      cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      cx.fill();
      if(!reduced){
        s.y += s.z*0.05;
        if(s.y > h){ s.y = -2; s.x = Math.random()*w; }
      }
    }
    if(!reduced) requestAnimationFrame(draw);
  }
  return {
    init:function(){
      canvas = document.getElementById('starCanvas');
      if(!canvas || !canvas.getContext) return;
      cx = canvas.getContext('2d');
      resize();
      makeStars(Math.max(40, Math.min(150, Math.round((w*h)/9000))));
      window.addEventListener('resize', function(){ resize(); makeStars(Math.max(40, Math.min(150, Math.round((w*h)/9000)))); });
      if(reduced) draw(0); else requestAnimationFrame(draw);
    }
  };
})();

/* Loose date reader for register values: Excel serial, ISO text, d/m/yyyy text.
   Returns 'YYYY-MM-DD' or null (never guesses on malformed years like "205"). */
function parseLooseDate(raw){
  if(raw===null || raw===undefined || raw==='') return null;
  var y, mo, d, m;
  if(typeof raw==='number'){
    if(!(raw>0)) return null;
    var iso = MiniXLSX.excelSerialToISODate(raw);
    if(!iso) return null;
    y = +iso.slice(0,4);
    return (y>=1990 && y<=2100) ? iso : null;
  }
  var t = String(raw).trim();
  if((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(t))){ d=+m[1]; mo=+m[2]; y=+m[3]; }
  else return null;
  if(y<1990 || y>2100 || mo<1 || mo>12 || d<1 || d>31) return null;
  var dt = new Date(Date.UTC(y, mo-1, d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return null;
  return y+'-'+(mo<10?'0':'')+mo+'-'+(d<10?'0':'')+d;
}
function regExpiryDerived(rec){
  var iso = parseLooseDate(rec.expiryDate);
  if(!iso) return null;
  var dd = daysUntil(iso);
  if(dd===null) return null;
  if(dd<0) return {label:'ໝົດອາຍຸແລ້ວ', cls:'badge-bad'};
  if(dd<=30) return {label:'ໃກ້ໝົດອາຍຸ ('+dd+' ມື້)', cls:'badge-warn'};
  return {label:'ຍັງບໍ່ໝົດອາຍຸ', cls:'badge-good'};
}

function i18nTranslateText(s){

    var nv = i18nTranslateText(node.nodeValue);
    if(nv!==node.nodeValue) node.nodeValue = nv;
    return;
  }
  if(node.nodeType!==1) return;
  if(node.tagName==='SCRIPT' || node.tagName==='STYLE') return;

    var attr = I18N_ATTRS[a];

      if(nv2!==v) node.setAttribute(attr, nv2);

      Array.prototype.forEach.call(m.addedNodes, function(n){ i18nWalk(n); });
    } else if(m.type==='characterData'){
