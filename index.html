/* ============================================================
   HELPERS
   ============================================================ */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(html!==undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(s){
  if(!s) return '';
  var d = new Date(s+'T00:00:00');
  if(isNaN(d.getTime())) return s;
  var mo=['ມ.ກ','ກ.ພ','ມ.ນ','ມ.ສ','ພ.ພ','ມິ.ຖ','ກ.ລ','ສ.ຫ','ກ.ຍ','ຕ.ລ','ພ.ຈ','ທ.ວ'];
  return d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear();
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  var d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
var BADGE_EXACT = {
  'activated':'badge-good','not activated':'badge-bad','expired':'badge-bad','pending renewal':'badge-warn',
  'disabled':'badge-neutral','activation required':'badge-warn',
  'ໃຊ້ງານ':'badge-good','ສຳຮອງ':'badge-warn','ຊຳຮຸດ':'badge-bad','ສູນຫາຍ':'badge-bad','ຈຳໜ່າຍ':'badge-neutral',
  'ຕ່ຳ':'badge-good','ກາງ':'badge-warn','ສູງ':'badge-bad','ວິກິດ':'badge-bad',
  'available':'badge-good','good':'badge-good',
  'in use':'badge-good','spare':'badge-warn','damaged':'badge-bad','lost':'badge-bad','disposed':'badge-neutral',
  'low':'badge-good','medium':'badge-warn','high':'badge-bad','critical':'badge-bad'
};
function badgeClass(value){
  var v = (value||'').toString().toLowerCase();
  var vt = v.replace(/\s+/g,' ').trim();
  if(Object.prototype.hasOwnProperty.call(BADGE_EXACT, vt)) return BADGE_EXACT[vt];
  var good=['closed','success','pass','yes','active','ສຳເລັດ','ໃຊ້ງານໄດ້','in use','low','ປິດແລ້ວ'];
  var bad=['open','failed','fail','no','high','expired','ປະຕິເສດ','ໝົດອາຍຸ','ເປີດ'];
  var warn=['in progress','medium','ກຳລັງ','pending','ລໍຖ້າ','ໃກ້ໝົດ','in repair'];
  var i;
  for(i=0;i<good.length;i++) if(v.indexOf(good[i])>-1) return 'badge-good';
  for(i=0;i<bad.length;i++) if(v.indexOf(bad[i])>-1) return 'badge-bad';
  for(i=0;i<warn.length;i++) if(v.indexOf(warn[i])>-1) return 'badge-warn';
  return 'badge-neutral';
}
function badgeHtml(value){
  if(value===undefined||value===null||value==='') return '<span class="empty-mini" style="padding:0;">—</span>';
  return '<span class="badge '+badgeClass(value)+'">'+esc(value)+'</span>';
}
function toast(msg, isErr){
  var root = $('#toastRoot');
  var t = el('div', {class:'toast'+(isErr?' err':'')}, esc(msg));
  root.appendChild(t);
  try{ isErr ? Sound.error() : Sound.success(); }catch(e){}
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); }, 300); }, 3200);
}
function clearUnsubs(){
  state.unsubs.forEach(function(u){ try{ u(); }catch(e){} });

function csvEscape(v){
  var s = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}

/* HUD: keep data-text of page titles in sync (used by the glitch effect) */
var hudObs = null, hudQueued = false;
function hudDecorate(){
  hudQueued = false;
  var hs = document.querySelectorAll('.page-head h1');
  for(var i=0;i<hs.length;i++){
    var t = hs[i].textContent || '';
    if(hs[i].getAttribute('data-text') !== t) hs[i].setAttribute('data-text', t);
  }
}
function hudWatch(){
  hudDecorate();
  if(hudObs || !window.MutationObserver) return;
  var root = document.getElementById('content');
  if(!root) return;
  hudObs = new MutationObserver(function(){
    if(hudQueued) return; hudQueued = true;
    (window.requestAnimationFrame || setTimeout)(hudDecorate, 30);
  });
  hudObs.observe(root, {childList:true, subtree:true, characterData:true});
}

function navigate(key, kind){
  state.currentKey = key;
  state.currentKind = kind;
  clearUnsubs();
  renderNav();
  (function(){ var ct = $('#content'); if(ct) ct.classList.toggle('wide', !!(MODULES[key] && kind!=='dashboard' && kind!=='policies' && kind!=='audit' && kind!=='specscore' && MODULES[key].fields && (MODULES[key].fields.length + (MODULES[key].linkAssets?MODULES[key].linkAssets.length:0) + (MODULES[key].derivedStatus?1:0))>8)); })();
  if(kind==='dashboard') renderDashboard();
  else if(kind==='policies') renderPolicies();
  else if(kind==='audit') renderAudit();
  else if(kind==='specscore') renderSpecScore();
  else if(kind==='eqtsummary') renderEqtSummary();
  else if(kind==='statusviews') renderStatusViews();
  else if(kind==='licenselog') renderLicenseLog();
  else renderModule(key);
  (function(){ var ct = $('#content'); if(ct && (kind==='licenselog' || kind==='statusviews')) ct.classList.add('wide'); })();
  hudWatch();
}

  $('#addBtn').addEventListener('click', function(){ openRecordModal(key, null, key==='assets' ? {assetId:nextAssetId()} : null); });

    return;
  }

  var ref = state.db.collection(key).limit(500);
  var unsub = ref.onSnapshot(function(snap){
    var rows = snap.docs.map(function(d){ var o=d.data()||{}; o.id=d.id; return o; });
    var sk = cfg.sortKey;
    if(sk){ rows.sort(function(a,b){ return String(a[sk]||'').localeCompare(String(b[sk]||''), 'en', {numeric:true, sensitivity:'base'}); }); }
    else { rows.sort(function(a,b){ return (a._createdAt||'') < (b._createdAt||'') ? 1 : -1; }); }
    state.cache[key] = rows;
    renderTable(key, $('#searchBox')? $('#searchBox').value : '');
  }, function(e){

  });
  state.unsubs.push(unsub);
}

function maskSecret(v){
  v = (v===undefined || v===null) ? '' : String(v);
  if(!v || /^n\/?a\b/i.test(v)) return v;
  return v.slice(0,3)+'••••••••';
}
function assetLookup(){
  var map = {};
  var list = (state.db && state.dbReady) ? (state.db.getAll('assets')||[]) : [];
  list.forEach(function(a){ if(a.assetId) map[String(a.assetId).trim().toLowerCase()] = a; });
  list.forEach(function(a){ var o = String(a.oldId||'').trim().toLowerCase(); if(o && !map[o]) map[o] = a; });
  return map;
}
function renderChips(key, allRows){
  var cfg = MODULES[key], holder = $('#chipRow');
  if(!holder || !cfg.chips) return;
  var sel = (state.chips && state.chips[key]) || {};
  var html = '';
  cfg.chips.forEach(function(fk){
    var f = cfg.fields.filter(function(x){ return x.key===fk; })[0];
    if(!f) return;
    var counts = {}, order = [];
    allRows.forEach(function(r){
      var v = (r[fk]===undefined || r[fk]===null) ? '' : String(r[fk]).trim();
      if(!v) return;
      if(counts[v]===undefined){ counts[v] = 0; order.push(v); }
      counts[v]++;
    });
    if(!order.length) return;
    order.sort(function(a, b){ return counts[b]-counts[a]; });
    html += '<div class="chip-grp"><span class="chip-l">'+esc(f.label)+'</span>'+
      order.map(function(v){
        return '<button type="button" class="chip-btn'+(sel[fk]===v?' on':'')+'" data-f="'+esc(fk)+'" data-v="'+esc(v)+'">'+esc(v)+' <b>'+counts[v]+'</b></button>';
      }).join('')+'</div>';
  });
  holder.innerHTML = html;
  holder.querySelectorAll('.chip-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var fk = this.getAttribute('data-f'), v = this.getAttribute('data-v');
      state.chips[key] = state.chips[key] || {};
      if(state.chips[key][fk]===v) delete state.chips[key][fk]; else state.chips[key][fk] = v;
      renderTable(key, $('#searchBox') ? $('#searchBox').value : '');
    });
  });
}

function renderTable(key, filterText){
  var cfg = MODULES[key];
  var all = state.cache[key] || [];
  renderChips(key, all);
  if(cfg.showNextId && $('#nextIdVal')) $('#nextIdVal').textContent = nextAssetId() || '—';
  var rows = all;
  var ch = (state.chips && state.chips[key]) || {};
  Object.keys(ch).forEach(function(fk){
    rows = rows.filter(function(r){ return String(r[fk]===undefined||r[fk]===null ? '' : r[fk]).trim()===ch[fk]; });
  });
  var ft = (filterText||'').trim().toLowerCase();
  if(ft){
    rows = rows.filter(function(r){
      return cfg.fields.some(function(f){ return !f.secret && (r[f.key]||'').toString().toLowerCase().indexOf(ft)>-1; });
    });
  }
  var holder = $('#tableHolder');
  if(!holder) return;
  if(!rows.length){
    var ft2 = ft || Object.keys(ch).length;
    holder.innerHTML = '<div class="empty-state"><div class="big">🗂️</div>'+(ft2? 'ບໍ່ພົບຂໍ້ມູນທີ່ຄົ້ນຫາ' : 'ຍັງບໍ່ມີຂໍ້ມູນ — ກົດ "ເພີ່ມລາຍການ" ເພື່ອເລີ່ມບັນທຶກ')+'</div>';
    return;
  }
  var cols = cfg.fields.filter(function(f){ return f.type!=='textarea'; });
  var amap = null;
  if(cfg.linkAssets){
    amap = assetLookup();
    var lk = cfg.linkAssets.map(function(p){ return {key:'__lk_'+p[0], label:p[1], link:p[0]}; });
    cols = cols.slice(0,1).concat(lk, cols.slice(1));
  }
  if(cfg.derivedStatus) cols = cols.concat([{key:'__derived', label:(cfg.derivedLabel||'ສະຖານະ'), derived:true}]);

  var thead = '<thead><tr>'+cols.map(function(f){ return '<th>'+esc(f.label)+'</th>'; }).join('')+'<th class="act-th"></th></tr></thead>';
  var tbody = '<tbody>'+rows.map(function(r){
    var tds = cols.map(function(f){
      if(f.derived){
        var ds = cfg.derivedStatus(r);
        return '<td>'+(ds? '<span class="badge '+ds.cls+'">'+esc(ds.label)+'</span>' : '—')+'</td>';
      }
      if(f.link){
        var a = amap[String(r.assetId||'').trim().toLowerCase()];
        return a ? '<td class="wrap">'+esc(a[f.link])+'</td>' : '<td title="ບໍ່ພົບ Asset ID ນີ້ໃນ IT Asset Register">—</td>';
      }
      var v = r[f.key];
      if(f.type==='date') return '<td>'+esc(fmtDate(v))+'</td>';
      if(f.badge) return '<td>'+badgeHtml(v)+'</td>';
      if(f.secret){
        var dup = 0;
        if(v && !/^n\/?a\b/i.test(String(v))){ all.forEach(function(x){ if(x[f.key]===v) dup++; }); }
        return dup>1 ? '<td class="wrap mono" title="ຄີນີ້ຖືກບັນທຶກໃນ '+dup+' ແຖວ — ກວດວ່າ License ອະນຸຍາດໃຫ້ໃຊ້ຫຼາຍເຄື່ອງບໍ (Retail ໂດຍທົ່ວໄປ 1 ເຄື່ອງ; Volume/GVLK ຊ້ຳໄດ້)">'+esc(maskSecret(v))+' <span class="badge badge-warn">⚠ ×'+dup+'</span></td>'
                       : '<td class="wrap mono" title="ປິດບັງໄວ້ — ເປີດດູເຕັມໃນໜ້າແກ້ໄຂ">'+esc(maskSecret(v))+'</td>';
      }
      return '<td class="wrap">'+esc(v)+'</td>';
    }).join('');
    return '<tr data-id="'+esc(r.id)+'">'+tds+
      '<td class="actions"><span class="row-actions">'+
        '<button class="icon-btn view-btn" title="ເບິ່ງ / ແກ້ໄຂ" aria-label="ເບິ່ງ / ແກ້ໄຂ" data-id="'+esc(r.id)+'">👁</button>'+
      '</span></td></tr>';
  }).join('')+'</tbody>';

  holder.innerHTML = '<table class="data'+(cols.length>8?' compact':'')+'">'+thead+tbody+'</table>'+
    (cols.length>8? '<div class="wide-hint">ຕາຕະລາງນີ້ມີ '+(cols.length-1)+' ຄໍລຳ — ກົດແຖວ ຫຼື 👁 ເພື່ອເບິ່ງທຸກຊ່ອງ; ຈະແກ້ໄຂໄດ້ຕໍ່ເມື່ອກົດ ✎ ແກ້ໄຂ ໃນໜ້າລາຍລະອຽດ.</div>' : '');
  holder.querySelectorAll('.view-btn').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); openRecordModal(key, this.getAttribute('data-id')); });
  });
  holder.querySelectorAll('tbody tr').forEach(function(tr){
    tr.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('button,a,input,select,textarea')) return;
      try{ if(window.getSelection && String(window.getSelection()).length>0) return; }catch(x){}
      openRecordModal(key, tr.getAttribute('data-id'));
    });
  });
}

function csvForModule(key){
  var cfg = MODULES[key];
  var rows = (state.db && state.dbReady) ? state.db.getAll(key) : (state.cache[key] || []);
  var headers = cfg.fields.map(function(f){ return f.label; });
  var lines = [headers.map(csvEscape).join(',')];
  if(rows && rows.length){
    rows.forEach(function(r){
      lines.push(cfg.fields.map(function(f){ return csvEscape(r[f.key]); }).join(','));
    });
  } else if(EXAMPLE_ROWS[key]){
    lines.push(EXAMPLE_ROWS[key].map(csvEscape).join(','));
  }
  return '﻿' + lines.join('\r\n');
}

function csvForAudit(){
  var headers = ['ລຳດັບ','ລາຍການກວດສອບ','ຜົນ','ຫຼັກຖານອ້າງອີງ','ຜູ້ກວດ'];

/* ============================================================
   MINI ZIP WRITER — bundles all module CSV templates into one
   downloadable .zip (STORE / no compression, so no inflate needed
   to write it). No external library, works fully offline.
   ============================================================ */
var MiniZipWriter = (function(){
  var CRC_TABLE = (function(){
    var t = new Uint32Array(256);
    for(var n=0;n<256;n++){
      var c = n;
      for(var k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
      t[n]=c>>>0;
    }
    return t;
  })();
  function crc32(bytes){
    var crc = 0xFFFFFFFF;
    for(var i=0;i<bytes.length;i++){ crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function dosDateTime(d){
    d = d || new Date();
    var time = ((d.getHours()&0x1F)<<11) | ((d.getMinutes()&0x3F)<<5) | ((d.getSeconds()>>1)&0x1F);
    var date = (((d.getFullYear()-1980)&0x7F)<<9) | (((d.getMonth()+1)&0xF)<<5) | (d.getDate()&0x1F);
    return {time:time, date:date};
  }
  function build(files){
    var encoder = new TextEncoder();
    var localParts = [];
    var centralParts = [];
    var offset = 0;
    var dt = dosDateTime();
    files.forEach(function(f){
      var nameBytes = encoder.encode(f.name);
      var dataBytes = typeof f.content === 'string' ? encoder.encode(f.content) : f.content;
      var crc = crc32(dataBytes);
      var localHeader = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dt.time, true);
      lv.setUint16(12, dt.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, dataBytes.length, true);
      lv.setUint32(22, dataBytes.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, dataBytes);

      var centralHeader = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dt.time, true);
      cv.setUint16(14, dt.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, dataBytes.length, true);
      cv.setUint32(24, dataBytes.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);

      offset += localHeader.length + dataBytes.length;
    });
    var centralStart = offset;
    var centralSize = centralParts.reduce(function(s,p){ return s+p.length; }, 0);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, centralStart, true);
    ev.setUint16(20, 0, true);

    var allParts = localParts.concat(centralParts, [eocd]);
    var totalLen = allParts.reduce(function(s,p){ return s+p.length; }, 0);
    var out = new Uint8Array(totalLen);
    var pos = 0;
    allParts.forEach(function(p){ out.set(p, pos); pos += p.length; });
    return out;
  }
  return { build: build };
})();

function exportAllCsvZip(){

  Object.keys(MODULES).forEach(function(key){

/* ============================================================
   MINI XLSX WRITER — builds one real multi-sheet .xlsx workbook
   (using MiniZipWriter above, STORE method, inline strings — no
   shared-string table needed). No external library.
   ============================================================ */
var MiniXLSXWriter = (function(){
  function xmlEscape(s){
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }
  function colLetter(idx){
    var s = '', n = idx + 1;
    while(n > 0){
      var rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function cellXml(rowIdx, colIdx, value, isHeader){
    var ref = colLetter(colIdx) + (rowIdx+1);
    var sAttr = isHeader ? ' s="1"' : '';
    if(value === null || value === undefined || value === ''){
      return '<c r="'+ref+'"'+sAttr+'/>';
    }
    if(typeof value === 'number' && isFinite(value)){
      return '<c r="'+ref+'"'+sAttr+'><v>'+value+'</v></c>';
    }
    return '<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(value)+'</t></is></c>';
  }
  function sheetXml(sheet){
    // Row 3 (index 2) is the column-header row in every sheet we write
    // (row1=title, row2=note/reference, row3=header, row4+=data) — bold
    // that row to match the original workbook's look.
    var rowsXml = sheet.data.map(function(row, rIdx){
      var cellsXml = row.map(function(v, cIdx){ return cellXml(rIdx, cIdx, v, rIdx===2); }).join('');
      return '<row r="'+(rIdx+1)+'">'+cellsXml+'</row>';
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<sheetData>'+rowsXml+'</sheetData></worksheet>';
  }
  var STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="2">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';

  function workbookXml(sheets){
    var sheetsXml = sheets.map(function(s, i){
      return '<sheet name="'+xmlEscape(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets>'+sheetsXml+'</sheets></workbook>';
  }
  function workbookRelsXml(sheets){
    var rels = sheets.map(function(s, i){
      return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
    }).join('');
    rels += '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>';
  }
  function contentTypesXml(sheets){
    var overrides = sheets.map(function(s, i){
      return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      overrides + '</Types>';
  }

  function build(sheets){
    var files = [];
    files.push({ name:'[Content_Types].xml', content: contentTypesXml(sheets) });
    files.push({ name:'_rels/.rels', content:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>' });
    files.push({ name:'xl/workbook.xml', content: workbookXml(sheets) });
    files.push({ name:'xl/_rels/workbook.xml.rels', content: workbookRelsXml(sheets) });
    files.push({ name:'xl/styles.xml', content: STYLES_XML });
    sheets.forEach(function(sheet, i){
      files.push({ name:'xl/worksheets/sheet'+(i+1)+'.xml', content: sheetXml(sheet) });
    });
    return MiniZipWriter.build(files);
  }

  return { build: build };
})();

/* Builds one row per Excel column position for a module, from either
   its real saved records (state.db.getAll) or — if empty — the sample
   row above, using the exact EXCEL_IMPORT_MAP column order (so cells
   that are Excel-only formula columns, e.g. license "ວັນຄົງເຫຼືອ", are
   simply left blank in the template). */
function excelRowsForTemplate(tpl){
  var mapKey = findMapKeyForSheet(tpl.name);
  var map = mapKey ? EXCEL_IMPORT_MAP[mapKey] : null;
  // Row layout must exactly match the original KGS Excel workbook, since
  // the Import Excel feature (importModuleSheet) reads data starting at
  // grid row index 3 (i.e. the 4th row): row1=title, row2=note/reference,
  // row3=header, row4+=example or real data.
  var rows = [ [tpl.title], [tpl.note], tpl.headers ];
  var records = (state.db && state.dbReady) ? (state.db.getAll(tpl.key) || []) : [];
  if(records.length && map){
    records.forEach(function(r){
      rows.push(map.cols.map(function(fkey){ return fkey ? (r[fkey]!==undefined? r[fkey] : '') : ''; }));
    });
  } else {
    rows.push(tpl.example);
  }
  return rows;
}

function exportAllExcelTemplate(){
  var sheets = SHEET_TEMPLATES.map(function(tpl){
    return { name: tpl.name, data: excelRowsForTemplate(tpl) };
  });
  var auditTitle = 'Pre-Audit Checklist — Checklist ກ່ອນ Audit (10 ລາຍການ) (KGS-IT-FRM-15)';
  var auditNote = 'ອ້າງອີງຄູ່ມືຫົວຂໍ້ 17 · ໃຊ້ກວດຄວາມພ້ອມກ່ອນການກວດສອບພາຍໃນ ຫຼື ການກວດຢັ້ງຢືນມາດຕະຖານ';
  var auditHeaders = ['ລຳດັບ','ລາຍການກວດສອບ','ຜົນ (ຜ່ານ/ບໍ່ຜ່ານ/N-A)','ຫຼັກຖານອ້າງອີງ','ຜູ້ກວດ'];
  var auditAll = (state.db && state.dbReady) ? (state.db.getAll('auditChecklist') || []) : [];
  var byId = {};
  auditAll.forEach(function(d){ byId[d.id] = d; });
  // Same 3-row preamble (title/note/header) as the module sheets, since
  // importAuditSheet also reads items starting at grid row index 3.
  var auditRows = [ [auditTitle], [auditNote], auditHeaders ];
  for(var i=0;i<AUDIT_ITEMS.length;i++){
    var d = byId['item'+(i+1)] || {};
    auditRows.push([i+1, AUDIT_ITEMS[i], d.result||'', d.evidence||'', d.checkedBy||'']);
  }
  sheets.push({ name: EXCEL_AUDIT_SHEET, data: auditRows });

  var bytes = MiniXLSXWriter.build(sheets);
  var ok = downloadFile('KGS_IT_Data_Template.xlsx', bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast(ok? 'ດາວໂຫຼດໄຟລ໌ Excel Template ສຳເລັດ — ຕື່ມຂໍ້ມູນແລ້ວ Import ກັບຄືນໄດ້ເລີຍ' : 'ດາວໂຫຼດບໍ່ສຳເລັດ', !ok);
}

/* ---------- Record modal ---------- */
function fmtFull(iso){
  var d = new Date(iso); if(isNaN(d.getTime())) return '';
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function roFieldHtml(f, rec){
  var v = rec[f.key], txt;
  if(v===undefined || v===null || v==='') txt = '<span class="ro-empty">—</span>';
  else if(f.type==='date') txt = esc(fmtDate(v));
  else if(f.badge) txt = badgeHtml(v);
  else if(f.secret) txt = '<span class="mono ro-secret" data-full="'+esc(v)+'" data-shown="0">'+esc(maskSecret(v))+'</span><button type="button" class="btn btn-sm ro-reveal">👁 ສະແດງ</button>';
  else txt = esc(v);
  return '<div class="field'+(f.type==='textarea'?' span2':'')+'"><label>'+esc(f.label)+'</label><div class="ro-val">'+txt+'</div></div>';
}
function editFieldHtml(f, rec){
  var val = rec[f.key]!==undefined ? rec[f.key] : '';
  var reqAttr = f.required ? ' required' : '';
  var reqStar = f.required ? ' <span class="req">*</span>' : '';
  var inputHtml = '';
  if(f.type==='select'){
    var opts = f.options.slice();
    if(val!=='' && opts.indexOf(String(val))<0) opts.push(String(val)); /* keep legacy / imported values editable */
    inputHtml = '<select id="f_'+f.key+'"'+reqAttr+'><option value="">—</option>'+
      opts.map(function(o){ return '<option value="'+esc(o)+'"'+(String(val)===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
      '</select>';
  } else if(f.type==='textarea'){
    inputHtml = '<textarea id="f_'+f.key+'"'+reqAttr+'>'+esc(val)+'</textarea>';
  } else {
    var sugg = f.suggest || null, dlHtml = '';
    if(f.suggestAssets && state.db){
      sugg = (state.db.getAll('assets')||[]).filter(function(a){ return a.assetId; }).map(function(a){ return [a.assetId, a.description||'']; });
    }
    if(sugg && sugg.length){
      dlHtml = '<datalist id="dl_'+f.key+'">'+sugg.map(function(o){
        return Array.isArray(o) ? '<option value="'+esc(o[0])+'" label="'+esc(o[1])+'"></option>' : '<option value="'+esc(o)+'"></option>';
      }).join('')+'</datalist>';
    }
    inputHtml = '<input type="'+(f.type==='date'?'date':(f.type==='number'?'number':'text'))+'" id="f_'+f.key+'" value="'+esc(val)+'"'+reqAttr+(dlHtml?' list="dl_'+f.key+'"':'')+'>'+dlHtml;
  }
  return '<div class="field'+(f.type==='textarea'?' span2':'')+'"><label>'+esc(f.label)+reqStar+'</label>'+inputHtml+'</div>';
}
var recEscBound = false;
function openRecordModal(key, id, prefill, startEdit){
  var cfg = MODULES[key];
  var rec = id ? (state.cache[key]||[]).find(function(r){ return r.id===id; }) : (prefill || {});
  rec = rec || {};
  var editing = !id || !!startEdit, dirty = false, animate = true;
  var root = $('#modalRoot');
  function close(){ try{ Sound.close(); }catch(e){} root.innerHTML=''; }
  if(!recEscBound){
    recEscBound = true;
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape' && document.querySelector('#modalRoot .modal.view')){ try{ Sound.close(); }catch(x){} $('#modalRoot').innerHTML=''; }
    });
  }
  function discardOk(){ return !dirty || window.confirm('ມີການປ່ຽນແປງທີ່ຍັງບໍ່ໄດ້ບັນທຶກ — ຖິ້ມການປ່ຽນແປງບໍ?'); }
  function draw(){
    var fieldsHtml = editing ? cfg.fields.map(function(f){ return editFieldHtml(f, rec); }).join('')
                             : cfg.fields.map(function(f){ return roFieldHtml(f, rec); }).join('');
    if(!editing && cfg.derivedStatus){
      var ds = cfg.derivedStatus(rec);
      fieldsHtml += '<div class="field"><label>'+esc(cfg.derivedLabel||'ສະຖານະ')+'</label><div class="ro-val">'+(ds ? '<span class="badge '+ds.cls+'">'+esc(ds.label)+'</span>' : '<span class="ro-empty">—</span>')+'</div></div>';
    }
    var title = !id ? 'ເພີ່ມລາຍການໃໝ່' : (editing ? 'ແກ້ໄຂລາຍການ' : 'ລາຍລະອຽດ');
    var pill = editing ? '<span class="mode-pill edit">'+(id ? '✎ ກຳລັງແກ້ໄຂ' : '＋ ໃໝ່')+'</span>' : '<span class="mode-pill view">🔒 ອ່ານຢ່າງດຽວ</span>';
    var stamp = rec._updatedAt ? ('ແກ້ໄຂຄັ້ງຫຼ້າສຸດ: '+fmtFull(rec._updatedAt)) : (rec._createdAt ? ('ສ້າງເມື່ອ: '+fmtFull(rec._createdAt)) : '');
    var foot = editing
      ? ((id ? '<button class="btn btn-danger" id="deleteFromModal" style="margin-right:auto;">ລຶບລາຍການ</button>' : '')+
         '<button class="btn" id="cancelBtn">ຍົກເລີກ</button><button class="btn btn-primary" id="saveBtn">ບັນທຶກ</button>')
      : '<button class="btn" id="cancelBtn">ປິດ</button><button class="btn btn-primary" id="editBtn">✎ ແກ້ໄຂ</button>';
    root.innerHTML =
      '<div class="modal-scrim" id="scrimModal"><div class="modal '+(editing?'editing':'view')+(cfg.fields.length>6?' cols2':'')+(animate?'':' noanim')+'">'+
        '<div class="modal-head"><h3>'+esc(title)+' — '+esc(cfg.title)+' '+pill+'</h3><button class="icon-btn" id="closeModal" aria-label="ປິດ">✕</button></div>'+
        '<div class="modal-body" id="formFields">'+fieldsHtml+'</div>'+
        (!editing && stamp ? '<div class="modal-meta">'+esc(stamp)+'</div>' : '')+
        '<div class="modal-foot">'+foot+'</div>'+
      '</div></div>';
    animate = false;
    $('#closeModal').addEventListener('click', function(){ if(editing && !discardOk()) return; close(); });
    $('#cancelBtn').addEventListener('click', function(){
      if(editing && id){ if(!discardOk()) return; editing = false; dirty = false; draw(); }
      else { if(editing && !discardOk()) return; close(); }
    });
    /* clicking the dark background only closes the read-only view — never an open edit form */
    $('#scrimModal').addEventListener('click', function(e){ if(e.target.id==='scrimModal' && !editing) close(); });
    if(!editing){
      $('#editBtn').addEventListener('click', function(){
        editing = true; draw();
        var first = root.querySelector('#formFields input, #formFields select, #formFields textarea'); if(first) first.focus();
      });
      root.querySelectorAll('.ro-reveal').forEach(function(btn){
        btn.addEventListener('click', function(){
          var sp = btn.parentNode.querySelector('.ro-secret'), shown = sp.getAttribute('data-shown')==='1';
          sp.textContent = shown ? maskSecret(sp.getAttribute('data-full')) : sp.getAttribute('data-full');
          sp.setAttribute('data-shown', shown ? '0' : '1'); btn.textContent = shown ? '👁 ສະແດງ' : '🙈 ເຊື່ອງ';
        });
      });
      return;
    }
    var ff = $('#formFields');
    ff.addEventListener('input', function(){ dirty = true; });
    ff.addEventListener('change', function(){ dirty = true; });
    if(id){ $('#deleteFromModal').addEventListener('click', function(){ close(); confirmDelete(key, id); }); }
    $('#saveBtn').addEventListener('click', function(){
      var data = {};
      var missing = false;
      cfg.fields.forEach(function(f){
        var node = $('#f_'+f.key);
        var v = node.value;
        if(f.required && !v){ missing = true; node.style.borderColor='var(--danger)'; }
        data[f.key] = f.type==='number' ? (v===''? '' : Number(v)) : v;
      });
      if(missing){ toast('ກະລຸນາຕື່ມຂໍ້ມູນທີ່ຈຳເປັນ (*)', true); return; }
      saveRecord(key, id, data, close);
    });
  }
  try{ Sound.open(); }catch(e){}
  draw();
}

function saveRecord(key, id, data, done){
  if(!state.dbReady){ toast('ຖານຂໍ້ມູນບໍ່ພ້ອມໃຊ້ງານ', true); return; }
  var col = state.db.collection(key);
  var now = new Date().toISOString();
  var p;
  if(id){
    data._updatedAt = now;
    p = col.doc(id).update(data);
  } else {
    data._createdAt = now;
    p = col.add(data);
  }
  p.then(function(){ toast('ບັນທຶກສຳເລັດ'); if(done) done(); })
   .catch(function(e){ toast('ບັນທຶກບໍ່ສຳເລັດ: '+(e&&e.code||'error'), true); });
}

function confirmDelete(key, id){
  var root = $('#modalRoot');
  var cfg0 = MODULES[key], rec0 = (state.cache[key]||[]).find(function(r){ return r.id===id; }) || {};
  var label0 = cfg0 && cfg0.fields && cfg0.fields[0] ? String(rec0[cfg0.fields[0].key]||'') : '';
  root.innerHTML =
    '<div class="modal-scrim confirm-modal" id="scrimConfirm"><div class="modal">'+
      '<div class="modal-head"><h3>ລຶບລາຍການ?</h3><button class="icon-btn" id="cClose">✕</button></div>'+
      '<div class="modal-body">'+(label0 ? '<div><b style="color:#FFC85C">ລຶບ: '+esc(label0)+'</b></div>' : '')+'<div>ການລຶບນີ້ບໍ່ສາມາດກູ້ຄືນໄດ້. ທ່ານແນ່ໃຈບໍ່ວ່າຈະລຶບລາຍການນີ້?</div></div>'+
      '<div class="modal-foot"><button class="btn" id="cCancel">ຍົກເລີກ</button><button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);" id="cOk">ລຶບ</button></div>'+
    '</div></div>';
  try{ Sound.open(); }catch(e){}
  function close(){ try{ Sound.close(); }catch(e){} root.innerHTML=''; }
  $('#cClose').addEventListener('click', close);
  $('#cCancel').addEventListener('click', close);
  $('#scrimConfirm').addEventListener('click', function(e){ if(e.target.id==='scrimConfirm') close(); });
  $('#cOk').addEventListener('click', function(){
    state.db.collection(key).doc(id).delete()
      .then(function(){ toast('ລຶບແລ້ວ'); close(); })
      .catch(function(e){ toast('ລຶບບໍ່ສຳເລັດ: '+(e&&e.code||'error'), true); close(); });
  });
}

var ST_TABS = [['In Use','✅'],['Spare','🗄'],['Damaged','⚠'],['Lost','✖'],['Disposed','🗑']];
var ST_ALIAS = {'in use':'In Use','ໃຊ້ງານ':'In Use','spare':'Spare','ສຳຮອງ':'Spare','damaged':'Damaged','ຊຳຮຸດ':'Damaged','lost':'Lost','ສູນຫາຍ':'Lost','disposed':'Disposed','ຈຳໜ່າຍ':'Disposed'};
function stCanon(v){ var k = String(v===undefined||v===null ? '' : v).trim(); var a = ST_ALIAS[k.toLowerCase()]; return a || k; }
function regAssets(){
  var a = state.db ? state.db.getAll('assets') : [];
  a.sort(function(x, y){ return String(x.assetId||'').localeCompare(String(y.assetId||''), 'en', {numeric:true, sensitivity:'base'}); });
  return a;
}
function regSub(cols, fn){
  cols.forEach(function(cn){ state.unsubs.push(state.db.collection(cn).onSnapshot(function(){ fn(); })); });
}
function regViewHead(title, sub, btns){
  return '<div class="page-head"><div><div class="page-eyebrow"><span class="code-chip">KGS-IT-REG-003</span>ອ້າງອີງຄູ່ມືຫົວຂໍ້ 8.1</div>'+
    '<h1>'+esc(title)+'</h1><div class="page-sub">'+esc(sub)+'</div></div><div class="head-actions">'+(btns||'')+'</div></div>'+
    (state.dbReady ? '' : dbBannerHtml())+docBarHtml({docControl:REG003_DOC});
}
function regDate(v){ if(v===undefined||v===null||v==='') return ''; var s2 = String(v); return /^\d{4}-\d{2}-\d{2}$/.test(s2) ? fmtDate(s2) : s2; }
function regTodayStr(){ var d = new Date(); function p(n){ return n<10?'0'+n:''+n; } return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear(); }

/* ---- IT Equipment Summary ---- */
function eqtRows(){
  var map = {}, order = [], total = 0;
  EQT_TYPES.forEach(function(t){ map[t.toLowerCase()] = {name:t, n:0}; order.push(t.toLowerCase()); });
  regAssets().forEach(function(a){
    var t = String(a.assetType||'').trim() || '(ບໍ່ລະບຸ)', k = t.toLowerCase();
    if(!map[k]){ map[k] = {name:t, n:0}; order.push(k); }
    map[k].n++; total++;
  });
  return {rows:order.map(function(k){ return map[k]; }), total:total};
}
function renderEqtSummary(){
  var c = $('#content');
  c.innerHTML = regViewHead('IT Equipment Summary', 'ສະຫຼຸບຈຳນວນອຸປະກອນຕາມປະເພດ — ຄິດໄລ່ສົດຈາກ IT Asset Register', '<button class="btn" id="eqtCsv">⬇ Export CSV</button>')+
    '<div class="chip-row" id="eqtStatus"></div><div class="table-wrap"><div class="table-scroll" id="eqtBody"></div></div>';
  if(!state.dbReady) return;
  function draw(){
    var d = eqtRows(), st = {};
    regAssets().forEach(function(a){ var k = stCanon(a.status) || '—'; st[k] = (st[k]||0)+1; });
    $('#eqtStatus').innerHTML = '<div class="chip-grp"><span class="chip-l">Status</span>'+ST_TABS.map(function(t){ return '<span class="chip-btn">'+esc(t[0])+' <b>'+(st[t[0]]||0)+'</b></span>'; }).join('')+'</div>';
    $('#eqtBody').innerHTML = '<table class="data"><thead><tr><th>No.</th><th>Device Type</th><th>Total Quantity</th></tr></thead><tbody>'+
      d.rows.map(function(r, i){ return '<tr style="cursor:default"><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.n+'</td></tr>'; }).join('')+
      '<tr style="cursor:default"><td></td><td><b>Total</b></td><td><b>'+d.total+'</b></td></tr></tbody></table>';
  }
  $('#eqtCsv').addEventListener('click', function(){
    var d = eqtRows(), lines = [['No.','Device Type','Total Quantity'].map(csvEscape).join(',')];
    d.rows.forEach(function(r, i){ lines.push([i+1, r.name, r.n].map(csvEscape).join(',')); });
    lines.push(['', 'Total', d.total].map(csvEscape).join(','));
    var ok = downloadFile('KGS-IT-REG-003_Equipment-Summary.csv', '﻿'+lines.join('\n'), 'text/csv;charset=utf-8'); toast(ok?'Export ສຳເລັດ':'Export ບໍ່ສຳເລັດ', !ok);
  });
  regSub(['assets'], draw);
}

/* ---- License Log (Windows + Security per asset) ---- */
var LL_ASSET = [['assetId','Asset ID'],['assetType','Device Type'],['description','Device Name'],['serial','Serial No.'],['owner','Department'],['userName','Assigned User']];
var LL_LIC = [['vendor','Vendor'],['licenseType','Licence Type'],['details','License Details'],['productKey','Product Key / License Key'],['startDate','Start Date'],['expiryDate','Expiry Date'],['status','Status'],['remark','Remark']];
function llRows(){
  var w = {}, sc = {};
  (state.db.getAll('winLicenses')||[]).forEach(function(r){ var k = String(r.assetId||'').trim().toLowerCase(); if(k && !w[k]) w[k] = r; });
  (state.db.getAll('secLicenses')||[]).forEach(function(r){ var k = String(r.assetId||'').trim().toLowerCase(); if(k && !sc[k]) sc[k] = r; });
  return regAssets().map(function(a){ var k = String(a.assetId||'').trim().toLowerCase(); return {a:a, w:w[k]||{}, s:sc[k]||{}}; });
}
function llCell(f, r){
  var v = r[f];
  if(f==='productKey') return '<td class="wrap mono">'+esc(maskSecret(v))+'</td>';
  if(f==='status') return '<td>'+badgeHtml(v)+'</td>';
  if(f==='startDate') return '<td>'+esc(regDate(v))+'</td>';
  return '<td class="wrap">'+esc(v)+'</td>';
}
function renderLicenseLog(){
  var c = $('#content');
  c.innerHTML = regViewHead('License Log', 'ບັນຊີ License ລວມຕໍ່ເຄື່ອງ (Windows + Security) — ຄິດໄລ່ສົດຈາກ IT Asset, Windows License ແລະ Security License; ຄີ License ຖືກປິດບັງ', '<button class="btn" id="llCsv">⬇ Export CSV (ບໍ່ມີຄີເຕັມ)</button>')+
    '<div class="table-wrap"><div class="table-scroll" id="llBody"></div></div>';
  if(!state.dbReady) return;
  function draw(){
    var rows = llRows();
    if(!rows.length){ $('#llBody').innerHTML = '<div class="empty-state"><div class="big">🗂️</div>ຍັງບໍ່ມີຂໍ້ມູນ</div>'; return; }
    var h1 = '<tr><th colspan="'+LL_ASSET.length+'">Asset</th><th colspan="'+LL_LIC.length+'">Windows License</th><th colspan="'+LL_LIC.length+'">Security License</th></tr>';
    var h2 = '<tr>'+LL_ASSET.map(function(x){ return '<th>'+esc(x[1])+'</th>'; }).join('')+LL_LIC.map(function(x){ return '<th>'+esc(x[1])+'</th>'; }).join('')+LL_LIC.map(function(x){ return '<th>'+esc(x[1])+'</th>'; }).join('')+'</tr>';
    $('#llBody').innerHTML = '<table class="data compact"><thead>'+h1+h2+'</thead><tbody>'+rows.map(function(r){
      return '<tr data-id="'+esc(r.a.id)+'">'+LL_ASSET.map(function(x){ return '<td class="wrap">'+esc(r.a[x[0]])+'</td>'; }).join('')+
        LL_LIC.map(function(x){ return llCell(x[0], r.w); }).join('')+LL_LIC.map(function(x){ return llCell(x[0], r.s); }).join('')+'</tr>';
    }).join('')+'</tbody></table><div class="wide-hint">ໜ້ານີ້ເປັນຕາຕະລາງລວມ (ອ່ານຢ່າງດຽວ) — ແກ້ໄຂໄດ້ທີ່ໜ້າ Windows License ແລະ Security License; ກົດແຖວເພື່ອເບິ່ງຂໍ້ມູນເຄື່ອງ.</div>';
    $('#llBody').querySelectorAll('tbody tr').forEach(function(tr){ tr.addEventListener('click', function(){ openRecordModal('assets', tr.getAttribute('data-id')); }); });
  }
  $('#llCsv').addEventListener('click', function(){
    var head = LL_ASSET.map(function(x){ return x[1]; }).concat(LL_LIC.map(function(x){ return 'Windows '+x[1]; }), LL_LIC.map(function(x){ return 'Security '+x[1]; }));
    var lines = [head.map(csvEscape).join(',')];
    function lic(r){ return LL_LIC.map(function(x){ var v = r[x[0]]; if(x[0]==='productKey') v = maskSecret(v); if(x[0]==='startDate') v = regDate(v); return v; }); }
    llRows().forEach(function(r){ lines.push(LL_ASSET.map(function(x){ return r.a[x[0]]; }).concat(lic(r.w), lic(r.s)).map(csvEscape).join(',')); });
    var ok = downloadFile('KGS-IT-REG-003_License-Log.csv', '﻿'+lines.join('\n'), 'text/csv;charset=utf-8'); toast(ok?'Export ສຳເລັດ':'Export ບໍ່ສຳເລັດ', !ok);
  });
  regSub(['assets','winLicenses','secLicenses'], draw);
}

function renderAudit(){
  var c = $('#content');
  c.innerHTML =
    '<div class="page-head"><div><div class="page-eyebrow"><span class="code-chip">KGS-IT-FRM-15</span>ອ້າງອີງຄູ່ມືຫົວຂໍ້ 17</div>'+
    '<h1>Pre-Audit Checklist — ກ່ອນ Audit (10 ລາຍການ)</h1>'+
    '<div class="page-sub">ໃຊ້ກວດຄວາມພ້ອມກ່ອນການກວດສອບພາຍໃນ ຫຼື ການກວດຢັ້ງຢືນມາດຕະຖານ</div></div>'+
    '<div class="head-actions"><button class="btn" id="auditExportBtn">⬇ Export CSV</button></div>'+
    '</div>'+
    (state.dbReady? '' : dbBannerHtml())+
    '<div class="lock-hint">🔒 <span>ປ້ອງກັນການແກ້ໄຂໂດຍບໍ່ຕັ້ງໃຈ: ກົດ</span> <b>✎ ແກ້ໄຂ</b> <span>ທີ່ລາຍການນັ້ນກ່ອນ ຈຶ່ງຈະປ່ຽນຜົນກວດໄດ້</span></div>'+
    '<div id="auditList"></div>';

  $('#auditExportBtn').addEventListener('click', function(){
    var ok = downloadFile('KGS-IT-FRM-15_auditChecklist.csv', csvForAudit(), 'text/csv;charset=utf-8');
    toast(ok? 'Export ສຳເລັດ' : 'Export ບໍ່ສຳເລັດ', !ok);
  });

  var list = $('#auditList');
  list.innerHTML = AUDIT_ITEMS.map(function(label, i){
    return auditItemHtml(i, label, {});
  }).join('');

  if(!state.dbReady){ return; }

  AUDIT_ITEMS.forEach(function(label, i){
    var docId = 'item'+(i+1);
    var ref = state.db.doc('auditChecklist/'+docId);
    var unsub = ref.onSnapshot(function(snap){
      var data = snap.exists ? snap.data() : {};
      updateAuditRow(i, data||{});
    }, function(){});
    state.unsubs.push(unsub);
  });
}
function auditItemHtml(i, label){
  return '<div class="audit-item locked" data-idx="'+i+'" id="aud_item_'+i+'">'+
    '<div class="row1"><span class="idx">'+(i+1)+'</span><span class="txt">'+esc(label)+'</span></div>'+
    '<div class="audit-grid">'+
      '<select id="aud_result_'+i+'" disabled><option value="">— ຜົນ —</option><option>ຜ່ານ (Pass)</option><option>ບໍ່ຜ່ານ (Fail)</option><option>N/A</option></select>'+
      '<input type="text" id="aud_evidence_'+i+'" placeholder="ຫຼັກຖານອ້າງອີງ" disabled>'+
      '<input type="text" id="aud_checker_'+i+'" placeholder="ຜູ້ກວດ" disabled>'+
      '<span class="aud-btns"><button class="btn btn-sm" id="aud_edit_'+i+'">✎ ແກ້ໄຂ</button>'+
        '<button class="btn btn-primary btn-sm" id="aud_save_'+i+'" style="display:none">ບັນທຶກ</button>'+
        '<button class="btn btn-sm" id="aud_cancel_'+i+'" style="display:none">ຍົກເລີກ</button></span>'+
    '</div></div>';
}
function auditSetEdit(i, on){
  var item = $('#aud_item_'+i); if(!item) return;
  item.classList.toggle('locked', !on); item.classList.toggle('editing', !!on); item.__editing = !!on;
  ['aud_result_','aud_evidence_','aud_checker_'].forEach(function(p){ var n = $('#'+p+i); if(n) n.disabled = !on; });
  $('#aud_edit_'+i).style.display = on ? 'none' : '';
  $('#aud_save_'+i).style.display = on ? '' : 'none';
  $('#aud_cancel_'+i).style.display = on ? '' : 'none';
}
function auditFill(i, d){
  d = d || {};
  $('#aud_result_'+i).value = d.result || '';
  $('#aud_evidence_'+i).value = d.evidence || '';
  $('#aud_checker_'+i).value = d.checkedBy || '';
}
function updateAuditRow(i, data){
  var item = $('#aud_item_'+i); if(!item) return;
  item.__saved = {result:data.result||'', evidence:data.evidence||'', checkedBy:data.checkedBy||''};
  if(!item.__editing) auditFill(i, item.__saved);   /* never overwrite what the user is typing */
  var btn = $('#aud_save_'+i);
  if(btn && !btn.__wired){
    btn.__wired = true;
    $('#aud_edit_'+i).addEventListener('click', function(){ auditSetEdit(i, true); var r = $('#aud_result_'+i); if(r) r.focus(); });
    $('#aud_cancel_'+i).addEventListener('click', function(){ auditFill(i, item.__saved); auditSetEdit(i, false); });
    btn.addEventListener('click', function(){
      var docId = 'item'+(i+1);
      var payload = {
        label:AUDIT_ITEMS[i],
        result:$('#aud_result_'+i).value,
        evidence:$('#aud_evidence_'+i).value,
        checkedBy:$('#aud_checker_'+i).value,
        updatedAt:new Date().toISOString()
      };
      if(!state.db){ toast('ບັນທຶກບໍ່ສຳເລັດ', true); return; }
      state.db.doc('auditChecklist/'+docId).set(payload)
        .then(function(){ item.__saved = {result:payload.result, evidence:payload.evidence, checkedBy:payload.checkedBy}; auditSetEdit(i, false); toast('ບັນທຶກລາຍການ '+(i+1)+' ສຳເລັດ'); })
        .catch(function(err){ toast('ບັນທຶກບໍ່ສຳເລັດ', true); });
    });
  }
}

var policyEditing = {};
function policyOverrides(){
  var o = {};
  if(state.db){ (state.db.getAll('policyEdits')||[]).forEach(function(r){ o[r.id] = r; }); }
  return o;
}
function policyBodyHtml(text){
  var html = '', open = false;
  String(text||'').split(/\r?\n/).forEach(function(ln){
    ln = ln.replace(/^\s+|\s+$/g, ''); if(!ln) return;
    if(ln.indexOf('## ')===0){ if(open){ html += '</ul>'; open = false; } html += '<h4>'+esc(ln.slice(3))+'</h4>'; }
    else { if(!open){ html += '<ul>'; open = true; } html += '<li>'+esc(ln)+'</li>'; }
  });
  if(open) html += '</ul>';
  return html;
}
function renderPolicyCards(){
  var host = $('#policyList'); if(!host) return;
  var ov = policyOverrides();
  host.innerHTML = POLICY_DEFAULT.map(function(p){
    var o = ov[p.id], text = (o && typeof o.text==='string') ? o.text : p.text, ed = !!policyEditing[p.id], tools, body;
    if(ed){
      body = '<p class="pc-help">ແຕ່ລະແຖວ = 1 ຂໍ້; ແຖວທີ່ຂຶ້ນຕົ້ນດ້ວຍ ## = ຫົວຂໍ້ຍ່ອຍ</p><textarea class="pc-edit" id="pe_'+p.id+'">'+esc(text)+'</textarea>';
      tools = '<span class="pc-tools"><button class="btn btn-primary btn-sm" data-pe="save" data-id="'+p.id+'">ບັນທຶກ</button>'+
        '<button class="btn btn-sm" data-pe="cancel" data-id="'+p.id+'">ຍົກເລີກ</button>'+
        (o ? '<button class="btn btn-sm btn-danger" data-pe="reset" data-id="'+p.id+'">↺ ຄືນຄ່າເດີມ</button>' : '')+'</span>';
    } else {
      body = policyBodyHtml(text);
      tools = '<span class="pc-tools"><button class="btn btn-sm" data-pe="edit" data-id="'+p.id+'">✎ ແກ້ໄຂ</button></span>';
    }
    var mod = o ? '<div class="pc-mod">✎ ແກ້ໄຂໃນແອັບເມື່ອ '+esc(fmtFull(o.updatedAt))+' — ບໍ່ແມ່ນສະບັບອະນຸມັດຢ່າງເປັນທາງການ; ກວດທຽບກັບ KGS-IT-MAN-01 ກ່ອນນຳໃຊ້</div>' : '';
    return '<div class="policy-card'+(ed?' editing':'')+'" data-id="'+p.id+'"><div class="pc-head"><div><h2>'+esc(p.title)+'</h2><div class="ref">'+esc(p.ref)+'</div></div>'+tools+'</div>'+mod+body+'</div>';
  }).join('');
}
function renderPolicies(){
  policyEditing = {};
  var c = $('#content');
  c.innerHTML =
    '<div class="page-head"><div><div class="page-eyebrow">Phase 1 — Policy & Setup</div>'+
    '<h1>ນະໂຍບາຍ IT & AI Usage</h1><div class="page-sub">ສະບັບອ້າງອີງຫຍໍ້ — ສະບັບເຕັມທີ່ອະນຸມັດຢ່າງເປັນທາງການຢູ່ໃນເອກະສານ Word “KGS-IT-MAN-01”</div></div></div>'+
    '<div class="lock-hint">🔒 <span>ປ້ອງກັນການແກ້ໄຂໂດຍບໍ່ຕັ້ງໃຈ: ກົດ</span> <b>✎ ແກ້ໄຂ</b> <span>ທີ່ກ່ອງນັ້ນກ່ອນ ຈຶ່ງຈະປ່ຽນເນື້ອຫາໄດ້</span></div>'+
    '<div id="policyList"></div>';
  renderPolicyCards();
  $('#policyList').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-pe]') : null; if(!b) return;
    var act = b.getAttribute('data-pe'), id = b.getAttribute('data-id');
    if(act==='edit'){ policyEditing[id] = true; renderPolicyCards(); var t = $('#pe_'+id); if(t) t.focus(); }
    else if(act==='cancel'){ delete policyEditing[id]; renderPolicyCards(); }
    else if(act==='save'){
      var txt = ($('#pe_'+id)||{}).value || '';
      if(!txt.replace(/\s+/g,'')){ toast('ເນື້ອຫາວ່າງ — ບໍ່ສາມາດບັນທຶກໄດ້', true); return; }
      if(!state.db){ toast('ບັນທຶກບໍ່ສຳເລັດ', true); return; }
      var def = POLICY_DEFAULT.filter(function(p){ return p.id===id; })[0];
      var same = def && txt.replace(/\r/g,'').trim()===def.text.trim();
      var pr = same ? state.db.doc('policyEdits/'+id).delete() : state.db.doc('policyEdits/'+id).set({text:txt, updatedAt:new Date().toISOString()});
      pr.then(function(){ delete policyEditing[id]; renderPolicyCards(); toast('ບັນທຶກແລ້ວ'); });
    }
    else if(act==='reset'){
      if(!window.confirm('ຄືນຄ່າເດີມຂອງເນື້ອຫານີ້ບໍ?')) return;
      state.db.doc('policyEdits/'+id).delete().then(function(){ delete policyEditing[id]; renderPolicyCards(); toast('ກັບຄືນຄ່າເດີມແລ້ວ'); });
    }
  });
}

var ssKeyHandler = null, ssFsBound = false;
function ssSetFs(on){

  var lb = $('#ssFsLabel'); if(lb) lb.textContent = on ? ssT('fsOff') : ssT('fsOn');

function ssKeys(e){
  if(!$('#ssRoot')){ document.removeEventListener('keydown', ssKeyHandler); ssKeyHandler = null; document.body.style.overflow = ''; return; }
  var tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='select' || tag==='textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
  var d = $('#ssDetail'), isFs = !!(d && d.classList.contains('focus'));
  if(e.key==='Escape' && isFs) ssSetFs(false);
  else if(e.key==='f' || e.key==='F'){ e.preventDefault(); ssSetFs(!isFs); }
  else if((e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='ArrowRight'||e.key==='ArrowLeft') && ssLastRows.length){
    e.preventDefault();
    var i = ssLastRows.indexOf(ssSel), dd = (e.key==='ArrowDown'||e.key==='ArrowRight') ? 1 : -1;
    ssSel = ssLastRows[(i+dd+ssLastRows.length)%ssLastRows.length]; ssEdit = false; ssRenderAll(); ssRenderForm();
  }

function ssParticles(){
  var cv = $('#ssFx'), ctx = cv && cv.getContext && cv.getContext('2d'); if(!ctx) return;
  var W, H, P = [], dpr = Math.min(2, window.devicePixelRatio||1);
  function size(){
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.round(Math.min(70, W*H/22000)); P = [];
    for(var i=0;i<n;i++) P.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, m:Math.random()<.25});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var a = P[i];
      for(var j=i+1;j<P.length;j++){
        var b = P[j], dx = a.x-b.x, dy = a.y-b.y, d = dx*dx+dy*dy;
        if(d<16000){ ctx.strokeStyle = 'rgba(0,238,255,'+(0.10*(1-d/16000)).toFixed(3)+')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
      ctx.fillStyle = a.m ? 'rgba(255,43,214,.7)' : 'rgba(0,238,255,.6)'; ctx.fillRect(a.x-1,a.y-1,2,2);
    }
  }
  function tick(){
    if(!document.body.contains(cv)){ window.removeEventListener('resize', size); return; }
    P.forEach(function(q){ q.x += q.vx; q.y += q.vy; if(q.x<0||q.x>W) q.vx *= -1; if(q.y<0||q.y>H) q.vy *= -1; });
    draw();
    if(!document.hidden) requestAnimationFrame(tick); else setTimeout(function(){ requestAnimationFrame(tick); }, 500);
  }
  size(); window.addEventListener('resize', size);
  if(ssRM) draw(); else requestAnimationFrame(tick);
}

/* ============================================================
   EXCEL IMPORT — reads the user's existing KGS_IT_Forms_Templates
   .xlsx workbook (or any file that follows the same sheet layout)
   directly in the browser, with no server and no external library,
   and writes matching rows straight into the local database.
   ============================================================ */
function normalizeName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9຀-໿]/g,''); }

function findMapKeyForSheet(sheetName){
  var trimmed = (sheetName||'').trim();
  if(EXCEL_IMPORT_MAP[trimmed]) return trimmed;
  var norm = normalizeName(trimmed);
  var k;
  for(k in EXCEL_IMPORT_MAP){ if(normalizeName(k)===norm) return k; }
  for(k in MODULES){ if(normalizeName(MODULES[k].title)===norm){
    for(var sn in EXCEL_IMPORT_MAP){ if(EXCEL_IMPORT_MAP[sn].key===k) return sn; }
  } }
  return null;
}

function fieldValueFromCell(field, raw){
  if(raw===null || raw===undefined) return '';
  if(typeof raw === 'boolean') raw = raw ? 'Yes' : 'No';
  if(field && (field.type==='date' || field.key==='month')){
    if(typeof raw === 'number'){
      var iso = MiniXLSX.excelSerialToISODate(raw) || '';
      return field.key==='month' ? iso.slice(0,7) : iso;
    }
    var s = String(raw).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return field.key==='month' ? s.slice(0,7) : s.slice(0,10);
    if(field.type!=='date') return s; // free-text month field, non-date-looking value — keep as typed
    var d = new Date(s);
    return isNaN(d.getTime()) ? s : d.toISOString().slice(0,10);
  }
  if(field && field.type==='number'){
    var n = Number(raw);
    return isNaN(n) ? '' : n;
  }
  return String(raw).trim();
}

async function importModuleSheet(map, grid){
  var cfg = MODULES[map.key];
  var col = state.db.collection(map.key);
  var count = 0;
  for(var r=3; r<grid.length; r++){
    var row = grid[r];
    if(!row) continue;
    var isExample = row.some(function(v){
      return typeof v==='string' && (v.indexOf('ຕົວຢ່າງ')>-1 || v.indexOf('ສະເລ່ຍ')>-1);
    });
    if(isExample) continue;
    var data = {};
    var hasVal = false;
    for(var ci=0; ci<map.cols.length; ci++){
      var fkey = map.cols[ci];
      if(!fkey) continue;
      var field = cfg.fields.filter(function(f){ return f.key===fkey; })[0];
      var val = fieldValueFromCell(field, row[ci]);
      if(val !== '') hasVal = true;
      data[fkey] = val;
    }
    if(!hasVal) continue;
    data._createdAt = new Date().toISOString();
    data._importedFromExcel = true;
    await col.add(data);
    count++;
  }
  return count;
}

async function importAuditSheet(grid){

}

/* ============================================================
   KGS-IT-REG-003 WORKBOOK IMPORT (IT Asset Register, Rev.00)
   Layout-checked, position-based reader for the approved register
   workbook: sheets "IT Asset", "Windows License", "Security License",
   "Microsoft office License", "Spare-IT". Re-importing updates rows by
   Asset ID / Spare ID instead of duplicating them. Rows that have only
   an Asset ID (reserved/blank) are skipped. Formula-only status sheets
   (ໃຊ້ງານ / ສຳຮອງ / ຊຳຮຸດ ...) and hidden helper sheets are ignored.
   ============================================================ */
var REG003_SHEETS = [
  {sheet:'IT Asset', key:'assets', label:'IT Asset Register (REG-003)', idKey:'assetId', idHdr:'assetid', remarkKey:'remarks',
   cols:{0:'assetId',1:'assetType',2:'description',3:'serial',4:'owner',5:'department',6:'status',7:'risk',8:'dateAcquired',9:'cpu',10:'ip',11:'userName'},
   optional:{12:['oldid','oldId']}, norm:REG003_NORM,
   dates:['dateAcquired'], check:{3:'serialno',9:'cpu',10:'ipaddress'}},
  {sheet:'Windows License', key:'winLicenses', label:'Windows License (REG-003)', idKey:'assetId', idHdr:'assetid', remarkKey:'remark',
   cols:{0:'assetId',7:'vendor',8:'licenseType',9:'details',10:'productKey',11:'startDate',12:'expiryDate',13:'status',14:'remark'},
   dates:['startDate'], expiry:['expiryDate'], check:{7:'vendor',10:'productkeylicensekey',13:'status'}},
  {sheet:'Security License', key:'secLicenses', label:'Security License (REG-003)', idKey:'assetId', idHdr:'assetid', remarkKey:'remark',
   cols:{0:'assetId',7:'vendor',8:'licenseType',9:'details',10:'productKey',11:'startDate',12:'expiryDate',13:'status',14:'remark'},
   dates:['startDate'], expiry:['expiryDate'], check:{7:'vendor',10:'productkeylicensekey',13:'status'}},
  {sheet:'Microsoft office License', key:'officeLicenses', label:'Microsoft office License (REG-003)', idKey:'assetId', idHdr:'assetid', remarkKey:'remark',
   cols:{0:'assetId',7:'officeVersion',8:'edition',9:'productId',10:'installDate',11:'expiryDate',12:'status',13:'remark'},
   dates:['installDate'], expiry:['expiryDate'], check:{7:'microsoftofficeversion',9:'productid',12:'status'}},
  {sheet:'Spare-IT', key:'spares', label:'Spare-IT (REG-003)', idKey:'spareId', idHdr:'spareid', remarkKey:'remarks',
   cols:{0:'spareId',1:'assetTag',2:'category',3:'deviceName',4:'brand',5:'model',6:'serial',7:'spec',8:'quantity',9:'unit',10:'condition',11:'storage',12:'receivedDate',13:'warrantyExpiry',14:'assignedTo',15:'status',16:'lastInspection',17:'remarks'},
   dates:['receivedDate','warrantyExpiry','lastInspection'], numbers:['quantity'], check:{6:'serialnumber',17:'remarks'}}
];
var REG003_FIELD_LABEL = {dateAcquired:'ວັນທີຮັບ', startDate:'Start Date', installDate:'Install Date', receivedDate:'Received Date', warrantyExpiry:'Warranty Expiry', lastInspection:'Last Inspection'};

function regCell(v){
  if(v===null || v===undefined) return '';
  if(typeof v==='boolean') return v ? 'Yes' : 'No';
  if(typeof v==='number') return v===0 ? '' : String(v);
  var t = String(v).replace(/\s+/g,' ').trim();
  return t==='0' ? '' : t;
}

function regParseSheet(def, grid, warnings){
  var hr = -1, r, c;
  for(r=0; r<Math.min(grid.length, 20); r++){
    if(grid[r] && normalizeName(String(grid[r][0]===null||grid[r][0]===undefined?'':grid[r][0]))===def.idHdr){ hr = r; break; }
  }
  if(hr<0){ warnings.push(def.sheet+': ບໍ່ພົບແຖວຫົວຕາຕະລາງ ('+def.idHdr+') — ຂ້າມຊີດນີ້'); return null; }
  for(c in def.check){
    if(normalizeName(String(grid[hr][+c]===null||grid[hr][+c]===undefined?'':grid[hr][+c]))!==def.check[c]){
      warnings.push(def.sheet+': ໂຄງສ້າງຄໍລຳບໍ່ກົງກັບ KGS-IT-REG-003 Rev.00 (ຄໍລຳທີ '+(+c+1)+' ຄາດວ່າ "'+def.check[c]+'") — ຂ້າມຊີດນີ້ ເພື່ອບໍ່ໃຫ້ຂໍ້ມູນສະຫຼັບຊ່ອງ'); return null;
    }
  }
  var cols = {}, oc;
  for(c in def.cols) cols[c] = def.cols[c];
  if(def.optional){
    for(oc in def.optional){
      if(normalizeName(String(grid[hr][+oc]===null||grid[hr][+oc]===undefined?'':grid[hr][+oc]))===def.optional[oc][0]) cols[oc] = def.optional[oc][1];
    }
  }
  var out = {rows:[], blank:0};
  for(r=hr+1; r<grid.length; r++){
    var row = grid[r]; if(!row) continue;
    var id = regCell(row[0]); if(!id) continue;
    var data = {}, extras = [], hasData = false, ci, fk, raw, txt, iso;
    for(ci in cols){
      fk = cols[ci]; if(fk===def.idKey){ data[fk] = id; continue; }
      raw = row[+ci];
      if(def.dates && def.dates.indexOf(fk)>-1){
        iso = parseLooseDate(raw);
        if(iso){ data[fk] = iso; hasData = true; }
        else { txt = regCell(raw); if(txt && !/^(n\/?a|-)$/i.test(txt)){ extras.push((REG003_FIELD_LABEL[fk]||fk)+' (ຄ່າເດີມ, ອ່ານເປັນວັນທີບໍ່ໄດ້): '+txt); warnings.push(id+' · '+(REG003_FIELD_LABEL[fk]||fk)+' "'+txt+'" ອ່ານເປັນວັນທີບໍ່ໄດ້ — ເກັບໄວ້ໃນໝາຍເຫດ'); hasData = true; } }
      } else if(def.expiry && def.expiry.indexOf(fk)>-1){
        iso = parseLooseDate(raw); txt = iso || regCell(raw);
        if(txt){ data[fk] = txt; hasData = true; }
      } else if(def.numbers && def.numbers.indexOf(fk)>-1){
        txt = regCell(raw); if(txt!=='' && isFinite(Number(txt))){ data[fk] = Number(txt); hasData = true; }
      } else {
        txt = regCell(raw);
        if(txt && def.norm && def.norm[fk] && def.norm[fk][txt]) txt = def.norm[fk][txt];
        if(txt){ data[fk] = txt; hasData = true; }
      }
    }
    if(!hasData){ out.blank++; continue; }
    if(def.key==='spares' && /^(ABC123|MON456)$/i.test(data.serial||'')){
      warnings.push(id+' · Spare-IT: Serial "'+data.serial+'" ເບິ່ງຄືຂໍ້ມູນຕົວຢ່າງຂອງ Template — ກວດກ່ອນໃຊ້');
      extras.push('ຕ້ອງກວດ: ອາດເປັນຂໍ້ມູນຕົວຢ່າງ');
    }
    if(extras.length){ data[def.remarkKey] = ((data[def.remarkKey]?data[def.remarkKey]+' | ':'')+'[ນຳເຂົ້າ] '+extras.join('; ')); }
    out.rows.push(data);
  }
  return out;
}

async function importReg003(wb, summary, warnings){
  var handled = {}, plans = [], i, j;
  for(i=0;i<REG003_SHEETS.length;i++){
    var def = REG003_SHEETS[i], real = null;
    for(j=0;j<wb.sheetNames.length;j++){ if(normalizeName(wb.sheetNames[j])===normalizeName(def.sheet)){ real = wb.sheetNames[j]; break; } }
    if(!real) continue;
    handled[normalizeName(real)] = true;
    var parsed = regParseSheet(def, wb.sheets[real]||[], warnings);
    if(parsed) plans.push({def:def, parsed:parsed});
  }
  if(!plans.length) return handled;
  /* Product / License keys are confidential: ask before storing them in this browser. */
  var keyCount = 0;
  plans.forEach(function(p){ p.parsed.rows.forEach(function(d){ if(d.productKey && !/^n\/?a\b/i.test(d.productKey)) keyCount++; }); });
  var importKeys = true;
  if(keyCount>0){
    importKeys = window.confirm('ພົບ Product/License Key '+keyCount+' ລາຍການ.\n\nຄີເປັນຂໍ້ມູນລັບ ແລະ ຈະຖືກເກັບໃນເບຣາເຊີຂອງເຄື່ອງນີ້ (ບໍ່ເຂົ້າລະຫັດ).\n\nOK = ນຳເຂົ້າພ້ອມຄີ\nCancel = ນຳເຂົ້າໂດຍບໍ່ເອົາຄີ (ຊ່ອງຄີຈະວ່າງ)');
    if(!importKeys) warnings.push('ບໍ່ນຳເຂົ້າ Product/License Key ('+keyCount+' ລາຍການ) ຕາມທີ່ເລືອກ');
  }
  /* Old ID -> new ID (workbook column "Old ID"): lets rows imported earlier under IT-H0xx be updated in place */
  var lc = function(v){ return String(v===undefined||v===null?'':v).trim().toLowerCase(); };
  var aliasOld = {}, newToOld = {};
  plans.forEach(function(p){
    if(p.def.key==='assets') p.parsed.rows.forEach(function(d){ if(d.oldId){ aliasOld[lc(d.oldId)] = d.assetId; newToOld[lc(d.assetId)] = d.oldId; } });
  });
  var migrated = 0;
  for(i=0;i<plans.length;i++){
    var pl = plans[i], d0 = pl.def, col = state.db.collection(d0.key);
    var existing = {}, touched = {};
    (state.db.getAll(d0.key)||[]).forEach(function(r){
      var k = lc(r[d0.idKey]); if(k) existing[k] = r.id;
      if(d0.key==='assets' && r.oldId){ var ko = lc(r.oldId); if(ko && !existing[ko]) existing[ko] = r.id; }
    });
    var added = 0, updated = 0, now = new Date().toISOString();
    for(j=0;j<pl.parsed.rows.length;j++){
      var data = pl.parsed.rows[j];
      if(!importKeys) delete data.productKey;
      data._importedFromExcel = true; data._src = 'KGS-IT-REG-003-HQ Rev.00';
      var idk = lc(data[d0.idKey]);
      var ex = existing[idk];
      if(!ex){
        var oid = (d0.key==='assets') ? data.oldId : newToOld[idk];
        if(oid && existing[lc(oid)]){ ex = existing[lc(oid)]; if(lc(oid)!==idk) migrated++; }
      }
      if(ex){ data._updatedAt = now; await col.doc(ex).update(data); updated++; touched[ex] = true; existing[idk] = ex; }
      else { data._createdAt = now; var ref = await col.add(data); existing[idk] = ref.id; touched[ref.id] = true; added++; }
    }
    var stale = (state.db.getAll(d0.key)||[]).filter(function(r){ return r._src && /^KGS-IT-REG-003/.test(r._src) && !touched[r.id]; }).length;
    if(stale>0) warnings.push(d0.label+': ມີ '+stale+' ລາຍການຈາກການນຳເຂົ້າກ່ອນ ທີ່ບໍ່ຢູ່ໃນໄຟລ໌ນີ້ (ID ເກົ່າ ຫຼື ຖືກລຶບອອກ) — ກວດ ແລະ ລຶບເອງຖ້າບໍ່ຕ້ອງການ');
    if(added+updated>0) summary.push({label:d0.label, count:added+updated, detail:'ໃໝ່ '+added+' · ອັບເດດ '+updated+(pl.parsed.blank? ' · ຂ້າມແຖວທີ່ມີແຕ່ ID '+pl.parsed.blank : '')});
    else if(pl.parsed.blank) warnings.push(d0.sheet+': ມີແຕ່ ID ຫວ່າງ '+pl.parsed.blank+' ແຖວ — ບໍ່ມີຂໍ້ມູນໃຫ້ນຳເຂົ້າ');
  }
  if(migrated>0) warnings.push('ຍ້າຍ ID ເກົ່າ → ID ໃໝ່ (IT-H0xx → IT-HQ-xxx) ຕາມຄໍລຳ Old ID ແລ້ວ '+migrated+' ລາຍການ ໂດຍບໍ່ສ້າງແຖວຊ້ຳ');
  /* Keep PC Spec Score links valid after the ID change */
  var tagFix = 0;
  if(Object.keys(aliasOld).length){
    var scores = state.db.getAll('specScores') || [];
    for(j=0;j<scores.length;j++){
      var tg = lc(scores[j].assetTag);
      if(tg && aliasOld[tg]){ await state.db.collection('specScores').doc(scores[j].id).update({assetTag:aliasOld[tg]}); tagFix++; }
    }
    if(tagFix>0) summary.push({label:'PC Spec Score — ອັບເດດ Asset ID', count:tagFix, detail:'IT-H0xx → IT-HQ-xxx'});
  }
  return handled;
}

async function importExcelFile(file){
  if(!window.DecompressionStream || !window.DOMParser){
    toast('ບຣາວເຊີ້ນີ້ບໍ່ຮອງຮັບການອ່ານໄຟລ໌ Excel ໂດຍກົງ — ກະລຸນາໃຊ້ Chrome/Edge ລຸ້ນໃໝ່', true);
    return;
  }
  toast('ກຳລັງອ່ານໄຟລ໌ Excel...');
  try{
    var buf = await file.arrayBuffer();
    var wb = await MiniXLSX.read(buf);
    var summary = [];
    var warnings = [];
    var regHandled = await importReg003(wb, summary, warnings);
    for(var i=0;i<wb.sheetNames.length;i++){
      var sname = wb.sheetNames[i];
      var grid = wb.sheets[sname];
      if(!grid || !grid.length) continue;
      if(regHandled[normalizeName(sname)]) continue;
      if(normalizeName(sname)===normalizeName(EXCEL_AUDIT_SHEET)){
        var n1 = await importAuditSheet(grid);
        if(n1>0) summary.push({label:'Pre-Audit Checklist (FRM-15)', count:n1});
        continue;
      }
      var mapKey = findMapKeyForSheet(sname);
      if(!mapKey) continue;
      var map = EXCEL_IMPORT_MAP[mapKey];
      var n2 = await importModuleSheet(map, grid);
      if(n2>0) summary.push({label:MODULES[map.key].title, count:n2});
    }
    showImportSummary(summary, warnings);
  }catch(err){
    toast('ນຳເຂົ້າ Excel ບໍ່ສຳເລັດ: '+(err&&err.message||'error'), true);
  }
}

/* ============================================================
   IT KPI REPORT — auto-calculate from real module data instead
   of typing every percentage by hand (mirrors the original Excel
   workbook's intent, where KPI figures were meant to reflect what
   was actually logged in the other sheets that month).
   ============================================================ */
function computeKpiAuto(monthStr){
  var backups = (state.db.getAll('backups')||[]).filter(function(r){ return (r.date||'').indexOf(monthStr)===0; });
  var backupSuccess = backups.length ? Math.round(backups.filter(function(r){ return r.result==='Success'; }).length/backups.length*100) : '';

  var restores = (state.db.getAll('restoreTests')||[]).filter(function(r){ return (r.testDate||'').indexOf(monthStr)===0; });
  var restorePass = restores.length ? Math.round(restores.filter(function(r){ return r.result==='Pass'; }).length/restores.length*100) : '';

  var issuesClosed = (state.db.getAll('issues')||[]).filter(function(r){ return r.dateFound && r.closedDate && r.closedDate.indexOf(monthStr)===0; });
  var avgResolutionHrs = '';
  if(issuesClosed.length){
    var totalHrs = issuesClosed.reduce(function(sum, r){
      var d1 = new Date(r.dateFound+'T00:00:00'), d2 = new Date(r.closedDate+'T00:00:00');
      var diff = (d2 - d1) / 3600000;
      return sum + (isFinite(diff) && diff>0 ? diff : 0);
    }, 0);
    avgResolutionHrs = Math.round(totalHrs/issuesClosed.length);
  }

  var checks = (state.db.getAll('securityChecks')||[]).filter(function(r){ return (r.checkDate||'').indexOf(monthStr)===0; });
  var patchChecks = checks.filter(function(r){ var it=(r.item||'').toLowerCase(); return it.indexOf('ແພັດ')>-1 || it.indexOf('patch')>-1; });
  var patchBase = patchChecks.length ? patchChecks : checks;
  var patchCompliance = patchBase.length ? Math.round(patchBase.filter(function(r){ return r.result==='Pass'; }).length/patchBase.length*100) : '';

  var aiLogs = (state.db.getAll('aiUsage')||[]).filter(function(r){ return (r.date||'').indexOf(monthStr)===0; });
  var aiReviewCompliance = aiLogs.length ? Math.round(aiLogs.filter(function(r){ return r.reviewed==='Yes'; }).length/aiLogs.length*100) : '';

  var licenses = (state.db.getAll('licenses')||[]).filter(function(r){ return !!r.expiryDate; });
  var licenseCompliance = licenses.length ? Math.round(licenses.filter(function(r){ var d=daysUntil(r.expiryDate); return d!==null && d>=0; }).length/licenses.length*100) : '';

  return {
    backupSuccess:backupSuccess, restorePass:restorePass, avgResolutionHrs:avgResolutionHrs,
    patchCompliance:patchCompliance, aiReviewCompliance:aiReviewCompliance, licenseCompliance:licenseCompliance
  };
}

/* ============================================================
   LOCAL DATA LAYER (browser localStorage — no server required)
   Implements the same collection/doc/onSnapshot surface the UI
   code above calls, so the whole app works fully offline as a
   single downloaded HTML file.
   ============================================================ */
function createLocalDb(){
  var PREFIX = 'kgsit_v1__';
  var memory = {};
  var useMemory = false;
  var listeners = {};     // collectionPath -> [cb]
  var docListeners = {};  // "path/id" -> [cb]

  (function testStorage(){
    try{
      var k = '__kgsit_test__'+Math.random();
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
    }catch(e){ useMemory = true; }
  })();

  function loadCollection(path){
    if(useMemory) return memory[path] || (memory[path] = {});
    try{
      var raw = window.localStorage.getItem(PREFIX+path);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveCollection(path, obj){
    if(useMemory){ memory[path] = obj; } else {
      try{ window.localStorage.setItem(PREFIX+path, JSON.stringify(obj)); }catch(e){}
    }
    notify(path);
  }
  function notify(path){
    var data = loadCollection(path);
    var docs = Object.keys(data).map(function(id){
      return {id:id, exists:true, data:function(){ return data[id]; }};
    });
    (listeners[path]||[]).slice().forEach(function(cb){ cb({docs:docs}); });
    Object.keys(docListeners).forEach(function(full){
      if(full.indexOf(path+'/')===0){
        var id = full.slice(path.length+1);
        var exists = Object.prototype.hasOwnProperty.call(data, id);
        (docListeners[full]||[]).slice().forEach(function(cb){
          cb({id:id, exists:exists, data:function(){ return exists? data[id] : undefined; }});
        });
      }
    });
  }
  function genId(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }

  function docRef(path, id){
    var full = path+'/'+id;
    return {
      id:id, path:full,
      get:function(){
        var data = loadCollection(path);
        var exists = Object.prototype.hasOwnProperty.call(data, id);
        return Promise.resolve({id:id, exists:exists, data:function(){ return exists? data[id] : undefined; }});
      },
      set:function(body){
        var data = loadCollection(path);
        data[id] = Object.assign({}, body);
        saveCollection(path, data);
        return Promise.resolve();
      },
      update:function(body){
        var data = loadCollection(path);
        data[id] = Object.assign({}, data[id]||{}, body);
        saveCollection(path, data);
        return Promise.resolve();
      },
      delete:function(){
        var data = loadCollection(path);
        delete data[id];
        saveCollection(path, data);
        return Promise.resolve();
      },
      onSnapshot:function(next){
        docListeners[full] = docListeners[full]||[];
        docListeners[full].push(next);
        var data = loadCollection(path);
        var exists = Object.prototype.hasOwnProperty.call(data, id);
        setTimeout(function(){ next({id:id, exists:exists, data:function(){ return exists? data[id] : undefined; }}); }, 0);
        return function(){ docListeners[full] = (docListeners[full]||[]).filter(function(f){ return f!==next; }); };
      }
    };
  }
  function collectionRef(path){
    return {
      limit:function(){ return this; },
      doc:function(id){ return docRef(path, id || genId()); },
      add:function(body){
        var id = genId();
        return docRef(path, id).set(body).then(function(){ return docRef(path, id); });
      },
      onSnapshot:function(next){
        listeners[path] = listeners[path]||[];
        listeners[path].push(next);
        var data = loadCollection(path);
        var docs = Object.keys(data).map(function(id){ return {id:id, exists:true, data:function(){ return data[id]; }}; });
        setTimeout(function(){ next({docs:docs}); }, 0);
        return function(){ listeners[path] = (listeners[path]||[]).filter(function(f){ return f!==next; }); };
      }
    };
  }
  return {
    collection:function(path){ return collectionRef(path); },
    doc:function(fullPath){
      var parts = fullPath.split('/'); var id = parts.pop(); var path = parts.join('/');
      return docRef(path, id);
    },
    /* Synchronous read of a whole collection — used by Excel import
       and the IT KPI Report auto-calculate feature, which both need
       cross-module data immediately rather than via onSnapshot. */
    getAll:function(path){
      var data = loadCollection(path);
      return Object.keys(data).map(function(id){ var o = Object.assign({}, data[id]); o.id = id; return o; });
    },
    usingMemory:useMemory,
    exportAll:function(){
      var out = {};
      if(useMemory){
        Object.keys(memory).forEach(function(p){ out[p] = memory[p]; });
      } else {
        try{
          for(var i=0;i<window.localStorage.length;i++){
            var k = window.localStorage.key(i);
            if(k.indexOf(PREFIX)===0){
              try{ out[k.slice(PREFIX.length)] = JSON.parse(window.localStorage.getItem(k)); }catch(e){}
            }
          }
        }catch(e){}
      }
      return out;
    },
    importAll:function(obj){
      Object.keys(obj||{}).forEach(function(path){ saveCollection(path, obj[path]); });
    }
  };
}

function downloadFile(filename, content, mime){
  try{
    var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){ return false; }
}

Auth.start(initShell);

})();
